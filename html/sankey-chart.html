<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projedata Sankey</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: var(--pd-font);
    overflow: hidden;
    background: transparent;
  }
  #chart-root {
    --acc: var(--pd-accent-1);
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: var(--pd-card-padding);
    background: var(--pd-card-bg);
    border: var(--pd-card-border-width) solid var(--pd-card-border-color);
    border-radius: var(--pd-card-radius);
    box-shadow: var(--pd-card-shadow);
  }
  #chart-root.accent-laranja { --acc: var(--pd-accent-2); }
  #chart-root.accent-amarelo { --acc: var(--pd-accent-3); }
  #chart-root.accent-azul-escuro { --acc: var(--pd-accent-4); }
  #chart-title {
    font-size: var(--pd-title-size); font-weight: var(--pd-title-weight); color: var(--pd-text-muted);
    text-transform: var(--pd-title-transform); letter-spacing: var(--pd-title-spacing);
    margin-bottom: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #chart-title.hidden { display: none !important; }
  #chart-status { font-size: 13px; color: var(--pd-text-muted); padding: 8px 0; }

  #chart-body { flex: 1; min-height: 0; position: relative; }
  #chart-body svg { display: block; width: 100%; height: 100%; font-family: var(--pd-font); }
  .sk-link { fill: none; stroke-opacity: 0.32; transition: stroke-opacity .12s; }
  .sk-link:hover { stroke-opacity: 0.65; }
  .sk-label { fill: var(--pd-text); font-size: 11px; paint-order: stroke; stroke: var(--pd-card-bg); stroke-width: 3px; stroke-linejoin: round; }
  .sk-label tspan.v { fill: var(--pd-text-muted); font-size: 10px; }
  .pd-tip {
    position: fixed; z-index: 9999; pointer-events: none; display: none;
    max-width: 260px; box-sizing: border-box; padding: 8px 12px;
    font-family: var(--pd-font); font-size: 12px; line-height: 1.35; color: var(--pd-text);
    background: var(--pd-tooltip-bg, var(--pd-surface));
    border: 1px solid var(--pd-tooltip-border, var(--pd-card-border-color));
    border-radius: var(--pd-tooltip-radius, 6px);
    box-shadow: var(--pd-tooltip-shadow, 0 6px 18px rgba(0,0,0,.35));
  }
  .pd-tip.on { display: block; }
  .pd-tip .tt-h { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .pd-tip .tt-h i { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  .pd-tip .tt-c { margin-top: 3px; font-size: 11px; color: var(--pd-text-muted); }
  .pd-tip .tt-v { margin-top: 2px; font-size: 15px; font-weight: 700; }
  /* clique filtra o dashboard (seleção de marcas) */
  .pd-click { cursor: pointer; }
  .pd-dim { opacity: 0.35; }
</style>
</head>
<body>

<div id="chart-root">
  <div id="chart-title">Carregando...</div>
  <div id="chart-body"></div>
</div>

<script>
(function () {
  var STATE_KEY = 'projedataSankeyState';
  var NS = 'http://www.w3.org/2000/svg';
  var root = document.getElementById('chart-root');
  var titleEl = document.getElementById('chart-title');
  var bodyEl = document.getElementById('chart-body');
  var ACCENT_CLASSES = ['accent-laranja', 'accent-amarelo', 'accent-azul-escuro'];

  var DISPLAY_UNITS = { K: [1e3, ' K'], M: [1e6, ' M'], B: [1e9, ' B'], T: [1e12, ' T'] };

  function formatCompact(v) {
    var dec = parseInt(state.decimals, 10);
    var hasDec = !isNaN(dec) && dec >= 0;
    var opts = hasDec ? { minimumFractionDigits: dec, maximumFractionDigits: dec } : { maximumFractionDigits: 1 };
    var fixed = DISPLAY_UNITS[state.displayUnits];
    if (fixed) return (v / fixed[0]).toLocaleString('pt-BR', opts) + fixed[1];
    var abs = Math.abs(v);
    if (abs >= 1e12) return (v / 1e12).toLocaleString('pt-BR', opts) + ' T';
    if (abs >= 1e9) return (v / 1e9).toLocaleString('pt-BR', opts) + ' B';
    if (abs >= 1e6) return (v / 1e6).toLocaleString('pt-BR', opts) + ' M';
    if (abs >= 1e3) return (v / 1e3).toLocaleString('pt-BR', opts) + ' K';
    return v.toLocaleString('pt-BR', opts);
  }

  var state = {
    accent: '', displayUnits: '', decimals: '',
    customLabel: '', showLabel: true,
    sourceField: '', targetField: '', stage3Field: '', valueField: '',
    linkColor: 'source', sortNodes: 'value', nodeWidth: 'normal', showValues: true, maxLinks: ''
  };
  var model = null;

  function loadState() {
    try {
      var saved = tableau.extensions.settings.get(STATE_KEY);
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch (e) { /* sem config salva ainda */ }
    ACCENT_CLASSES.forEach(function (c) { root.classList.remove(c); });
    // accent pode ser uma classe do tema ou uma cor personalizada (#RRGGBB)
    var customAccent = state.accent && state.accent.charAt(0) === '#';
    if (state.accent && !customAccent) root.classList.add(state.accent);
    if (customAccent) root.style.setProperty('--pd-accent-1', state.accent);
    else root.style.removeProperty('--pd-accent-1');
    titleEl.classList.toggle('hidden', state.showLabel === false);
  }

  function findColumnIndex(columns, fieldName, fallback) {
    if (fieldName) {
      var idx = columns.findIndex(function (c) { return c.fieldName === fieldName; });
      if (idx !== -1) return idx;
      // o Tableau entrega cálculo agregado como AGG(nome) ou AGREG(nome), conforme o idioma: casa também sem o prefixo
      var bare = function (n) { var m = /^[^()]+\((.*)\)$/.exec(n || ''); return m ? m[1] : n; };
      idx = columns.findIndex(function (c) { return bare(c.fieldName) === bare(fieldName); });
      if (idx !== -1) return idx;
    }
    return fallback;
  }

  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(e);
    return e;
  }

  /* rows: [{ path: [rótulo da etapa 1, etapa 2, ...], value }] -> nós por etapa e fluxos entre etapas adjacentes */
  function buildModel(rows, stages) {
    var nodes = {}, levels = [], links = {}, linkList = [];
    for (var i = 0; i < stages; i++) levels.push([]);
    function node(lvl, label, raw, field) {
      var k = lvl + '|' + label;
      if (!nodes[k]) {
        nodes[k] = { key: k, lvl: lvl, label: label, inV: 0, outV: 0, ins: [], outs: [], sel: (raw !== null && raw !== undefined && field) ? [{ fieldName: field, value: raw }] : null };
        levels[lvl].push(nodes[k]);
      }
      return nodes[k];
    }
    rows.forEach(function (r) {
      for (var l = 0; l < stages - 1; l++) {
        var s = node(l, r.path[l], r.raws[l], r.fields[l]), t = node(l + 1, r.path[l + 1], r.raws[l + 1], r.fields[l + 1]), k = s.key + '>' + t.key;
        if (!links[k]) { links[k] = { source: s, target: t, value: 0, sel: (s.sel && t.sel) ? s.sel.concat(t.sel) : null }; linkList.push(links[k]); }
        links[k].value += r.value;
      }
    });
    var max = parseInt(state.maxLinks, 10);
    if (max > 0 && linkList.length > max) {
      linkList = linkList.slice().sort(function (a, b) { return b.value - a.value; }).slice(0, max);
    }
    levels.forEach(function (lv) { lv.length = 0; });
    var seen = {};
    linkList.forEach(function (lk) {
      lk.source.outs.push(lk); lk.target.ins.push(lk);
      [lk.source, lk.target].forEach(function (n) { if (!seen[n.key]) { seen[n.key] = 1; levels[n.lvl].push(n); } });
    });
    levels.forEach(function (lv) {
      lv.forEach(function (n) {
        n.inV = n.ins.reduce(function (a, b) { return a + b.value; }, 0);
        n.outV = n.outs.reduce(function (a, b) { return a + b.value; }, 0);
        n.value = Math.max(n.inV, n.outV);
      });
      if (state.sortNodes !== 'data') lv.sort(function (a, b) { return b.value - a.value; });
    });
    // mesma cor para o mesmo rótulo em qualquer etapa
    var colorOf = {}, n = 0;
    levels.forEach(function (lv) { lv.forEach(function (nd) { if (colorOf[nd.label] === undefined) colorOf[nd.label] = n++; }); });
    levels.forEach(function (lv) { lv.forEach(function (nd) { nd.color = 'var(--pd-series-' + ((colorOf[nd.label] % 8) + 1) + ')'; }); });
    return { levels: levels, links: linkList };
  }

  function render() {
    bodyEl.innerHTML = '';
    if (!model || !model.links.length) {
      var empty = document.createElement('div');
      empty.id = 'chart-status';
      empty.textContent = 'Sem dados';
      bodyEl.appendChild(empty);
      return;
    }
    var W = bodyEl.clientWidth, H = bodyEl.clientHeight;
    if (W < 80 || H < 60) return;
    var L = model.levels.length;
    var nodeW = { thin: 8, normal: 14, wide: 22 }[state.nodeWidth] || 14;
    var labelM = Math.max(58, Math.min(150, W * 0.18));
    var x0 = labelM, x1 = W - labelM, pad = 10, top = 4, bottom = 4;
    var plotH = H - top - bottom;

    // altura por unidade: a etapa mais "apertada" define a escala de todas
    var ky = Infinity;
    model.levels.forEach(function (lv) {
      if (!lv.length) return;
      var sum = lv.reduce(function (a, n) { return a + n.value; }, 0);
      ky = Math.min(ky, (plotH - pad * (lv.length - 1)) / sum);
    });
    if (!(ky > 0)) { ky = 0.0001; }

    model.levels.forEach(function (lv, l) {
      var total = lv.reduce(function (a, n) { return a + n.value * ky; }, 0) + pad * Math.max(0, lv.length - 1);
      var y = top + (plotH - total) / 2;
      lv.forEach(function (n) {
        n.x = x0 + (L > 1 ? l * (x1 - x0 - nodeW) / (L - 1) : 0);
        n.y = y; n.h = n.value * ky;
        y += n.h + pad;
      });
    });
    // fluxos empilhados em cada nó, na ordem vertical do outro extremo (menos cruzamentos)
    model.levels.forEach(function (lv) {
      lv.forEach(function (n) {
        var o = n.y;
        n.outs.sort(function (a, b) { return a.target.y - b.target.y; }).forEach(function (lk) { lk.sy = o; lk.w = lk.value * ky; o += lk.w; });
        var i = n.y;
        n.ins.sort(function (a, b) { return a.source.y - b.source.y; }).forEach(function (lk) { lk.ty = i; i += lk.value * ky; });
      });
    });

    var svg = el('svg', { viewBox: '0 0 ' + W + ' ' + H, width: W, height: H }, bodyEl);
    var gl = el('g', {}, svg);
    model.links.forEach(function (lk) {
      var sx = lk.source.x + nodeW, tx = lk.target.x, mx = (sx + tx) / 2;
      var sy = lk.sy + lk.w / 2, ty = lk.ty + lk.w / 2;
      var stroke = state.linkColor === 'target' ? lk.target.color : state.linkColor === 'neutral' ? 'var(--pd-text-muted)' : lk.source.color;
      var p = el('path', { class: 'sk-link', d: 'M' + sx + ' ' + sy + 'C' + mx + ' ' + sy + ' ' + mx + ' ' + ty + ' ' + tx + ' ' + ty, 'stroke-width': Math.max(1, lk.w), stroke: stroke }, gl);
      pdBindClick(p, lk.sel);
      var t = el('title', {}, p);
      t.textContent = lk.source.label + ' → ' + lk.target.label + '\n' + formatCompact(lk.value);
    });
    var gn = el('g', {}, svg);
    var maxChars = Math.floor((labelM - 12) / 6.2);
    model.levels.forEach(function (lv, l) {
      lv.forEach(function (n) {
        var r = el('rect', { x: n.x, y: n.y, width: nodeW, height: Math.max(1, n.h), fill: n.color }, gn);
        pdBindClick(r, n.sel);
        var t = el('title', {}, r);
        t.textContent = n.label + '\n' + formatCompact(n.value);
        if (n.h < 11) return;
        var first = l === 0, last = l === L - 1;
        var txt = el('text', { class: 'sk-label', y: n.y + n.h / 2 + 4, x: first ? n.x - 6 : n.x + nodeW + 6, 'text-anchor': first ? 'end' : 'start' }, gn);
        var lab = n.label;
        if ((first || last) && lab.length > maxChars) lab = lab.slice(0, maxChars - 1) + '…';
        txt.appendChild(document.createTextNode(lab));
        if (state.showValues !== false) {
          var v = el('tspan', { class: 'v', dx: 5 }, txt);
          v.textContent = formatCompact(n.value);
        }
      });
    });
    pdApplySelection();
  }

  var loadTimeoutId = null;
  /* ===== Clique seleciona a marca (filtra o dashboard) ===== */
  var clickDim = { field: '' };
  var clickSets = {}, selectedKeys = null, selCount = {}, selLoaded = false;
  function pdWs() { return tableau.extensions.worksheetContent.worksheet; }
  function pdNames(pairs) { return pairs.map(function (p) { return p.fieldName; }).join('\u0002'); }
  function pdKeyOf(pairs) { return pdNames(pairs) + '\u0003' + pairs.map(function (p) { return String(p.value); }).join('\u0001'); }
  // pares {fieldName, value} das colunas idxs de uma linha (ignora campos sem valor)
  function pdSel(cols, row, idxs) {
    var out = [];
    idxs.forEach(function (i) {
      if (i >= 0 && row[i] && row[i].value !== null && row[i].value !== undefined) out.push({ fieldName: cols[i].fieldName, value: row[i].value });
    });
    return out;
  }
  // target: valor da dimensão (usa clickDim.field) ou lista de pares {fieldName, value}
  function pdBindClick(el, target) {
    if (state.clickFilter === false || target === null || target === undefined) return;
    var pairs = Array.isArray(target) ? target : [{ fieldName: clickDim.field, value: target }];
    if (!pairs.length || !pairs[0].fieldName) return;
    var key = pdKeyOf(pairs), names = pdNames(pairs);
    clickSets[names] = pairs.map(function (p) { return p.fieldName; });
    el.setAttribute('data-pd-key', key);
    el.classList.add('pd-click');
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var T = tableau.SelectionUpdateType, ws = pdWs();
      var multi = ev.ctrlKey || ev.metaKey || ev.shiftKey;
      var already = !!(selectedKeys && selectedKeys[key]);
      var p;
      if (multi) p = ws.selectMarksByValueAsync(pairs, already ? T.Remove : T.Add);
      else if (already && selCount[names] === 1) p = ws.clearSelectedMarksAsync();
      else p = ws.selectMarksByValueAsync(pairs, T.Replace);
      p.catch(function (e) { console.warn('[Projedata] seleção de marcas falhou:', e && (e.message || e)); });
    });
  }
  function pdApplySelection() {
    var els = document.querySelectorAll('[data-pd-key]');
    for (var i = 0; i < els.length; i++) {
      var on = !!selectedKeys && !!selectedKeys[els[i].getAttribute('data-pd-key')];
      els[i].classList.toggle('pd-dim', !!selectedKeys && !on);
      els[i].classList.toggle('pd-sel', on);
    }
    if (!selLoaded && Object.keys(clickSets).length) { selLoaded = true; pdRefreshSelection(); }
  }
  function pdRefreshSelection() {
    if (state.clickFilter === false || !Object.keys(clickSets).length) return;
    pdWs().getSelectedMarksAsync().then(function (m) {
      var keys = null, counts = {}, t = m && m.data && m.data[0];
      if (t && t.data.length) {
        keys = {};
        Object.keys(clickSets).forEach(function (names) {
          var fields = clickSets[names];
          var ci = fields.map(function (f) { var k = -1; t.columns.forEach(function (c, i) { if (c.fieldName === f) k = i; }); return k; });
          if (!ci.every(function (k) { return k !== -1; })) return;
          t.data.forEach(function (r) {
            var key = names + '\u0003' + ci.map(function (k) { return String(r[k].value); }).join('\u0001');
            if (!keys[key]) { keys[key] = true; counts[names] = (counts[names] || 0) + 1; }
          });
        });
      }
      if (keys && !Object.keys(keys).length) keys = null; // seleção que não casa com as marcas desenhadas: não esmaece
      selectedKeys = keys;
      selCount = counts;
      pdApplySelection();
    }).catch(function () {});
  }
  function pdInitClick() {
    pdWs().addEventListener(tableau.TableauEventType.MarkSelectionChanged, pdRefreshSelection);
    // clique fora das marcas limpa a seleção
    document.addEventListener('click', function () {
      if (state.clickFilter !== false && selectedKeys) pdWs().clearSelectedMarksAsync().catch(function () {});
    });
    pdRefreshSelection();
  }

  function updateChart() {
    titleEl.textContent = 'Carregando...';
    if (loadTimeoutId) clearTimeout(loadTimeoutId);
    loadTimeoutId = setTimeout(function () {
      titleEl.textContent = 'Tempo excedido — abra o console (F12)';
      bodyEl.innerHTML = '';
    }, 8000);

    var worksheet = tableau.extensions.worksheetContent.worksheet;
    worksheet.getSummaryDataAsync({ ignoreSelection: true }).then(function (sumData) {
      clearTimeout(loadTimeoutId);
      if (!sumData || !sumData.columns || sumData.columns.length < 3) {
        titleEl.textContent = 'Arraste a origem, o destino (e opcionalmente uma 3ª etapa) e a medida para as Marcas';
        bodyEl.innerHTML = '';
        return;
      }
      var cols = sumData.columns;
      var isNum = function (c) { return c.dataType === 'int' || c.dataType === 'float'; };
      var texts = [];
      cols.forEach(function (c, i) { if (!isNum(c)) texts.push(i); });
      var srcIdx = findColumnIndex(cols, state.sourceField, texts[0] !== undefined ? texts[0] : 0);
      var tgtIdx = findColumnIndex(cols, state.targetField, texts.filter(function (i) { return i !== srcIdx; })[0]);
      if (tgtIdx === undefined) tgtIdx = srcIdx === 0 ? 1 : 0;
      var s3Idx = state.stage3Field ? findColumnIndex(cols, state.stage3Field, -1) : -1;
      var valIdx = findColumnIndex(cols, state.valueField, -1);
      if (valIdx === -1) valIdx = cols.findIndex(function (c, i) { return i !== srcIdx && i !== tgtIdx && i !== s3Idx && isNum(c); });
      if (valIdx === -1) valIdx = cols.length - 1;

      titleEl.textContent = (state.customLabel && state.customLabel.trim() !== '') ? state.customLabel : '';
      titleEl.classList.toggle('hidden', state.showLabel === false || !titleEl.textContent);

      var idxs = s3Idx !== -1 ? [srcIdx, tgtIdx, s3Idx] : [srcIdx, tgtIdx];
      var rows = [];
      (sumData.data || []).forEach(function (row) {
        var c = row[valIdx];
        if (!c || typeof c.value !== 'number' || isNaN(c.value) || c.value <= 0) return;
        rows.push({
          path: idxs.map(function (i) { return row[i] && row[i].formattedValue !== '' ? row[i].formattedValue : '(vazio)'; }),
          raws: idxs.map(function (i) { return row[i] ? row[i].value : null; }),
          fields: idxs.map(function (i) { return cols[i].fieldName; }),
          value: c.value
        });
      });
      model = buildModel(rows, idxs.length);
      render();
    }).catch(function (err) {
      clearTimeout(loadTimeoutId);
      console.error('[Projedata Sankey] erro ao ler dados da planilha:', err);
      titleEl.textContent = 'Erro: ' + (err && (err.message || err.toString()) || 'ver console (F12)');
      bodyEl.innerHTML = '';
    });
  }

  function openConfigDialog() {
    tableau.extensions.ui.displayDialogAsync('https://renatoheinzen.github.io/tableau-skin/html/sankey-chart-config.html', '', { height: 760, width: 340 })
      .then(function () { loadState(); updateChart(); })
      .catch(function (error) {
        console.log('[Projedata Sankey] dialog fechado:', error && error.message);
      });
  }

  if (typeof tableau === 'undefined' || !tableau.extensions) {
    titleEl.textContent = 'Falha ao carregar script da API do Tableau';
    return;
  }

  var initTimeoutId = setTimeout(function () {
    titleEl.textContent = 'Timeout: initializeAsync não respondeu em 15s';
  }, 15000);

  if (window.ResizeObserver) new ResizeObserver(function () { if (model) render(); }).observe(bodyEl);
  else window.addEventListener('resize', function () { if (model) render(); });

  try {
    tableau.extensions.initializeAsync({ configure: openConfigDialog }).then(function () {
      clearTimeout(initTimeoutId);
      loadState();
      tableau.extensions.worksheetContent.worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, updateChart);
      pdInitClick();
      updateChart();
    }).catch(function (err) {
      clearTimeout(initTimeoutId);
      titleEl.textContent = 'Erro no initializeAsync: ' + (err && (err.message || err.toString()) || 'desconhecido');
    });
  } catch (syncErr) {
    clearTimeout(initTimeoutId);
    titleEl.textContent = 'Erro síncrono: ' + (syncErr && syncErr.message || syncErr);
  }
})();
</script>

<script>
// dica de ferramenta própria: converte title (HTML) e <title> (SVG) em um cartão estilizado
(function () {
  var tip = document.createElement('div');
  tip.className = 'pd-tip';
  document.body.appendChild(tip);
  function textOf(n) {
    if (n.namespaceURI === 'http://www.w3.org/2000/svg') {
      for (var i = 0; i < n.children.length; i++) {
        if (n.children[i].localName === 'title') { var t = n.children[i].textContent; n.removeChild(n.children[i]); n.setAttribute('data-tip', t); break; }
      }
    } else if (n.hasAttribute && n.hasAttribute('title')) {
      n.setAttribute('data-tip', n.getAttribute('title')); n.removeAttribute('title');
    }
    return n.getAttribute ? n.getAttribute('data-tip') : null;
  }
  function find(t) {
    for (var n = t; n && n !== document.body; n = n.parentNode) { if (n.nodeType === 1 && textOf(n)) return n; }
    return null;
  }
  function color(n) {
    if (n.namespaceURI !== 'http://www.w3.org/2000/svg') return '';
    var cs = getComputedStyle(n), c = cs.fill;
    if (!c || c === 'none' || c.indexOf('url(') === 0) c = cs.stroke;
    return c && c !== 'none' && c.indexOf('url(') !== 0 ? c : '';
  }
  function add(cls, txt) { var d = document.createElement('div'); d.className = cls; d.textContent = txt; tip.appendChild(d); }
  function show(n, e) {
    var lines = n.getAttribute('data-tip').split('\n'), head = lines[0], cat = '', val = '', m;
    if ((m = /^(.*?) · (.*): ([^:]*)$/.exec(head))) { head = m[1]; cat = m[2]; val = m[3]; }
    else if (lines.length === 1 && (m = /^(.*): ([^:]*)$/.exec(head))) { head = m[1]; val = m[2]; }
    tip.innerHTML = '';
    var h = document.createElement('div'); h.className = 'tt-h';
    var c = color(n);
    if (c) { var sw = document.createElement('i'); sw.style.background = c; h.appendChild(sw); }
    var nm = document.createElement('span'); nm.textContent = head; h.appendChild(nm); tip.appendChild(h);
    if (cat) add('tt-c', cat);
    lines.slice(1).forEach(function (l) { add('tt-c', l); });
    if (val) add('tt-v', val);
    tip.classList.add('on'); move(e);
  }
  function move(e) {
    var w = tip.offsetWidth, h = tip.offsetHeight, x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > window.innerWidth - 4) x = e.clientX - w - 14;
    if (y + h > window.innerHeight - 4) y = e.clientY - h - 14;
    tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
  }
  document.addEventListener('mouseover', function (e) { var n = find(e.target); if (n) show(n, e); else tip.classList.remove('on'); });
  document.addEventListener('mousemove', function (e) { if (tip.classList.contains('on')) { var n = find(e.target); if (n) move(e); else tip.classList.remove('on'); } });
  document.addEventListener('mouseleave', function () { tip.classList.remove('on'); });
})();
</script>
</body>
</html>
