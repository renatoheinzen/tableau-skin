<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Format Extension — Projedata Map Card</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<style>
  :root {
    --azul-escuro: #0C0F3D;
    --azul: #3246FF;
    --laranja: #FE5000;
    --cinza: #F6F6F6;
    --preto: #161616;
    --branco: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: 'Montserrat', Arial, sans-serif;
    color: var(--preto);
    background: var(--branco);
  }
  body { padding: 16px; overflow-y: auto; }
  h2 { margin: 0 0 4px 0; font-size: 15px; color: var(--azul-escuro); }
  .subtitle { font-size: 11px; color: #888; margin-bottom: 16px; }

  label.field { display: block; margin-top: 12px; font-weight: 600; font-size: 12px; color: var(--azul-escuro); }

  .accent-row { display: flex; gap: 10px; margin: 8px 0 4px 0; }
  .accent-swatch {
    width: 24px; height: 24px; border-radius: 50%;
    cursor: pointer; border: 2px solid transparent;
  }
  .accent-swatch.selected { border-color: var(--preto); }

  .checkbox-row { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
  .checkbox-row input { width: auto; }
  .checkbox-row label { font-weight: 600; font-size: 12px; color: var(--azul-escuro); margin: 0; }

  .actions {
    display: flex; gap: 8px; margin-top: 22px;
    position: sticky; bottom: 0; background: var(--branco); padding-top: 10px;
  }
  button {
    flex: 1; padding: 9px; border: none; border-radius: 4px;
    font-weight: 700; font-size: 13px; cursor: pointer;
  }
  #save-btn { background: var(--azul); color: var(--branco); }
  #save-btn:hover { background: var(--azul-escuro); }
  #cancel-btn { background: var(--cinza); color: var(--preto); }
  #cancel-btn:hover { background: #e2e2e2; }
</style>
</head>
<body>

<h2>Projedata Map Card</h2>
<div class="subtitle">Formatar extensão</div>

<label class="field">Gradiente de cor</label>
<div class="accent-row" id="accent-row">
  <div class="accent-swatch selected" data-accent="" style="background:#3246FF" title="Azul"></div>
  <div class="accent-swatch" data-accent="accent-laranja" style="background:#FE5000" title="Laranja"></div>
  <div class="accent-swatch" data-accent="accent-azul-escuro" style="background:#0C0F3D" title="Azul escuro"></div>
</div>

<div class="checkbox-row">
  <input type="checkbox" id="show-legend-input" checked>
  <label for="show-legend-input">Mostrar legenda</label>
</div>

<div class="actions">
  <button id="cancel-btn">Cancelar</button>
  <button id="save-btn">Salvar</button>
</div>

<script>
(function () {
  var accentRow = document.getElementById('accent-row');
  var showLegendInput = document.getElementById('show-legend-input');
  var saveBtn = document.getElementById('save-btn');
  var cancelBtn = document.getElementById('cancel-btn');

  var state = { accent: '', showLegend: true };

  function selectAccent(accent) {
    state.accent = accent;
    document.querySelectorAll('.accent-swatch').forEach(function (el) {
      el.classList.toggle('selected', el.dataset.accent === accent);
    });
  }

  accentRow.addEventListener('click', function (e) {
    var swatch = e.target.closest('.accent-swatch');
    if (swatch) selectAccent(swatch.dataset.accent);
  });

  function populateForm() {
    selectAccent(state.accent || '');
    showLegendInput.checked = state.showLegend !== false;
  }

  function closeWithoutSaving() {
    tableau.extensions.ui.closeDialog('cancelled');
  }
  cancelBtn.addEventListener('click', closeWithoutSaving);

  function save() {
    state.showLegend = showLegendInput.checked;

    tableau.extensions.settings.set('projedataMapState', JSON.stringify(state));
    tableau.extensions.settings.saveAsync().then(function () {
      tableau.extensions.ui.closeDialog('saved');
    }).catch(function (err) {
      console.error('[Projedata Map config] erro ao salvar:', err);
      alert('Erro ao salvar configurações. Veja o console (F12).');
    });
  }
  saveBtn.addEventListener('click', save);

  tableau.extensions.initializeDialogAsync().then(function () {
    try {
      var saved = tableau.extensions.settings.get('projedataMapState');
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch (e) { /* sem config salva ainda */ }
    populateForm();
  }).catch(function (err) {
    console.error('[Projedata Map config] erro ao inicializar dialog:', err);
    populateForm();
  });
})();
</script>

</body>
</html>
