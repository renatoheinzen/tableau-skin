<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projedata Skin</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #skin-root {
    width: 100%;
    height: 100%;
    position: relative;
    background-color: #3246FF;
    background-image: url('../assets/background.jpg');
    background-size: cover;
    background-position: center;
  }
  #logo {
    position: absolute;
    top: 32px;
    left: 16px;
    max-width: 180px;
    max-height: 70px;
  }
</style>
</head>
<body>
<div id="skin-root">
  <img id="logo" src="../assets/logo.png" alt="" onerror="this.style.display='none'">
</div>
<script>
  if (typeof tableau !== 'undefined' && tableau.extensions) {
    tableau.extensions.initializeAsync().catch(function (err) {
      console.warn('[Projedata Skin] initializeAsync não respondeu (normal se aberto fora do Tableau):', err);
    });
  }
</script>
</body>
</html>
