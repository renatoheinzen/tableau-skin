<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projedata KPI Card</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: 'Montserrat', Arial, sans-serif;
    overflow: hidden;
    background: transparent;
  }
  #kpi-root {
    width: 100%; height: 100%;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 12px 16px;
    background: transparent;
  }
  #kpi-root.align-center { align-items: center; text-align: center; }
  #kpi-root.align-left { align-items: flex-start; text-align: left; }

  #kpi-label {
    font-size: 12px; font-weight: 600; color: #6b7280;
    text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #kpi-label.hidden { display: none !important; }

  #kpi-value {
    font-weight: 700; color: var(--azul);
    line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #kpi-root.accent-laranja #kpi-value { color: var(--laranja); }
  #kpi-root.accent-amarelo #kpi-value { color: var(--amarelo); }
  #kpi-root.accent-azul-escuro #kpi-value { color: var(--azul-escuro); }

  #kpi-root.size-small #kpi-value { font-size: clamp(14px, 5vw, 24px); }
  #kpi-root.size-medium #kpi-value { font-size: clamp(20px, 8vw, 40px); }
  #kpi-root.size-large #kpi-value { font-size: clamp(28px, 11vw, 56px); }

  #kpi-variation {
    font-size: 13px; font-weight: 700; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #kpi-variation.hidden { display: none !important; }
  #kpi-variation.up { color: #16a34a; }
  #kpi-variation.down { color: #dc2626; }
  #kpi-variation.flat { color: #6b7280; }
</style>
</head>
<body>

<div id="kpi-root" class="size-medium align-left">
  <div id="kpi-label">Carregando...</div>
  <div id="kpi-value">—</div>
  <div id="kpi-variation" class="hidden"></div>
</div>

<script>
(function () {
  var root = document.getElementById('kpi-root');
  var labelEl = document.getElementById('kpi-label');
  var valueEl = document.getElementById('kpi-value');
  var variationEl = document.getElementById('kpi-variation');

  var ACCENT_CLASSES = ['accent-laranja', 'accent-amarelo', 'accent-azul-escuro'];
  var SIZE_CLASSES = ['size-small', 'size-medium', 'size-large'];
  var ALIGN_CLASSES = ['align-left', 'align-center'];

  var state = {
    accent: '', customLabel: '', showLabel: true,
    prefix: '', suffix: '', valueField: '', prefixField: '', suffixField: '',
    compareField: '', displayUnits: '',
    fontSize: 'size-medium', align: 'align-left',
    bgColor: '',
    lastRawValue: ''
  };
  var lastPrefixValue = '';
  var lastSuffixValue = '';
  var lastRawNumber = null;
  var lastCompareNumber = null;

  var DISPLAY_UNITS = {
    K: { divisor: 1e3, suffix: ' K' },
    M: { divisor: 1e6, suffix: ' M' },
    B: { divisor: 1e9, suffix: ' B' },
    T: { divisor: 1e12, suffix: ' T' }
  };

  function formatDisplayValue() {
    var unit = DISPLAY_UNITS[state.displayUnits];
    if (!unit || lastRawNumber == null) return state.lastRawValue;
    var divided = (lastRawNumber / unit.divisor).toLocaleString('pt-BR', {
      minimumFractionDigits: 1, maximumFractionDigits: 1
    });
    return divided + unit.suffix;
  }

  function fieldValue(sumData, fieldName) {
    if (!fieldName) return '';
    var idx = sumData.columns.findIndex(function (c) { return c.fieldName === fieldName; });
    if (idx === -1 || !sumData.data[0] || !sumData.data[0][idx]) return '';
    return sumData.data[0][idx].formattedValue;
  }

  function fieldRawValue(sumData, fieldName) {
    if (!fieldName) return null;
    var idx = sumData.columns.findIndex(function (c) { return c.fieldName === fieldName; });
    if (idx === -1 || !sumData.data[0] || !sumData.data[0][idx]) return null;
    var raw = sumData.data[0][idx].value;
    return (typeof raw === 'number' && !isNaN(raw)) ? raw : null;
  }

  function renderVariation() {
    if (!state.compareField || lastRawNumber == null || lastCompareNumber == null || lastCompareNumber === 0) {
      variationEl.classList.add('hidden');
      return;
    }
    var diffPct = ((lastRawNumber - lastCompareNumber) / Math.abs(lastCompareNumber)) * 100;
    var arrow = diffPct > 0 ? '▲' : (diffPct < 0 ? '▼' : '—');
    var cls = diffPct > 0 ? 'up' : (diffPct < 0 ? 'down' : 'flat');
    variationEl.textContent = arrow + ' ' + Math.abs(diffPct).toFixed(1).replace('.', ',') + '%';
    variationEl.className = cls;
  }

  function applyLayout() {
    ACCENT_CLASSES.concat(SIZE_CLASSES, ALIGN_CLASSES).forEach(function (c) { root.classList.remove(c); });
    if (state.accent) root.classList.add(state.accent);
    root.classList.add(state.fontSize || 'size-medium');
    root.classList.add(state.align || 'align-left');
    labelEl.classList.toggle('hidden', state.showLabel === false);
    root.style.background = state.bgColor || 'transparent';
    renderValue();
  }

  function renderValue() {
    if (state.lastRawValue === '' || state.lastRawValue == null) return;
    var prefix = state.prefixField ? lastPrefixValue : (state.prefix || '');
    var suffix = state.suffixField ? lastSuffixValue : (state.suffix || '');
    valueEl.textContent = prefix + formatDisplayValue() + suffix;
    renderVariation();
  }

  function loadState() {
    try {
      var saved = tableau.extensions.settings.get('projedataKpiState');
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch (e) { /* sem config salva ainda */ }
    applyLayout();
  }

  var loadTimeoutId = null;
  function updateKpi() {
    labelEl.textContent = 'Carregando...';
    console.log('[Projedata KPI] iniciando leitura de dados...');

    if (loadTimeoutId) clearTimeout(loadTimeoutId);
    loadTimeoutId = setTimeout(function () {
      labelEl.textContent = 'Tempo excedido — abra o console (F12)';
      valueEl.textContent = '—';
      console.warn('[Projedata KPI] getSummaryDataAsync não respondeu em 8s.');
    }, 8000);

    var worksheet = tableau.extensions.worksheetContent.worksheet;
    worksheet.getSummaryDataAsync({ ignoreSelection: true }).then(function (sumData) {
      clearTimeout(loadTimeoutId);
      console.log('[Projedata KPI] dados recebidos:', sumData);

      if (!sumData || !sumData.columns || sumData.columns.length === 0) {
        labelEl.textContent = 'Arraste um campo para as Marcas';
        valueEl.textContent = '—';
        return;
      }

      var valueIdx = 0;
      if (state.valueField) {
        var foundIdx = sumData.columns.findIndex(function (c) { return c.fieldName === state.valueField; });
        if (foundIdx !== -1) valueIdx = foundIdx;
      }
      var columnName = sumData.columns[valueIdx].fieldName;
      labelEl.textContent = (state.customLabel && state.customLabel.trim() !== '') ? state.customLabel : columnName;
      labelEl.classList.toggle('hidden', state.showLabel === false);

      if (sumData.data && sumData.data.length > 0) {
        var valueCell = sumData.data[0][valueIdx];
        state.lastRawValue = valueCell.formattedValue;
        lastRawNumber = (typeof valueCell.value === 'number' && !isNaN(valueCell.value)) ? valueCell.value : null;
        lastPrefixValue = fieldValue(sumData, state.prefixField);
        lastSuffixValue = fieldValue(sumData, state.suffixField);
        lastCompareNumber = fieldRawValue(sumData, state.compareField);
        renderValue();
      } else {
        state.lastRawValue = '';
        valueEl.textContent = 'Sem dados';
        variationEl.classList.add('hidden');
      }
    }).catch(function (err) {
      clearTimeout(loadTimeoutId);
      console.error('[Projedata KPI] erro ao ler dados da planilha:', err);
      labelEl.textContent = 'Erro: ' + (err && (err.message || err.toString()) || 'ver console (F12)');
      valueEl.textContent = '—';
    });
  }

  function openConfigDialog() {
    var popupUrl = 'https://renatoheinzen.github.io/tableau-skin/html/kpi-config.html';
    tableau.extensions.ui.displayDialogAsync(popupUrl, '', { height: 560, width: 340 })
      .then(function () {
        // Dialog fechou normalmente (salvou) — recarrega estado e dado
        loadState();
        updateKpi();
      })
      .catch(function (error) {
        // ErrorCodes.DialogClosedByUser é disparado quando o usuário fecha sem salvar — ignorar
        console.log('[Projedata KPI] dialog fechado:', error && error.message);
      });
  }

  if (typeof tableau === 'undefined' || !tableau.extensions) {
    labelEl.textContent = 'Falha ao carregar script da API do Tableau';
    valueEl.textContent = '—';
    console.error('[Projedata KPI] window.tableau não existe — o script tableau.extensions.1.latest.js não carregou.');
    return;
  }

  var initTimeoutId = setTimeout(function () {
    labelEl.textContent = 'Timeout: initializeAsync não respondeu em 15s';
    valueEl.textContent = '—';
    console.warn('[Projedata KPI] initializeAsync não respondeu — normal se aberto fora do Tableau.');
  }, 15000);

  try {
    tableau.extensions.initializeAsync({ configure: openConfigDialog }).then(function () {
      clearTimeout(initTimeoutId);
      loadState();
      var worksheet = tableau.extensions.worksheetContent.worksheet;
      worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, updateKpi);
      updateKpi();
    }).catch(function (err) {
      clearTimeout(initTimeoutId);
      labelEl.textContent = 'Erro no initializeAsync: ' + (err && (err.message || err.toString()) || 'desconhecido');
      valueEl.textContent = '—';
      console.warn('Extensions API não inicializou:', err);
    });
  } catch (syncErr) {
    clearTimeout(initTimeoutId);
    labelEl.textContent = 'Erro síncrono: ' + (syncErr && syncErr.message || syncErr);
    valueEl.textContent = '—';
    console.error('[Projedata KPI] erro síncrono ao chamar initializeAsync:', syncErr);
  }
})();
</script>

</body>
</html>
