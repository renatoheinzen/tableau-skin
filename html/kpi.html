<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projedata KPI Card</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: var(--pd-font);
    overflow: hidden;
    background: transparent;
  }
  /* #kpi-root é a grade; cada .kpi-card é um KPI (um só, ou um por valor do campo "Repetir por") */
  #kpi-root {
    width: 100%; height: 100%;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: minmax(0, 1fr);
  }
  #kpi-root.repeat {
    gap: 12px;
    padding: 2px;
    grid-template-rows: none;
    grid-auto-rows: minmax(84px, 1fr);
    overflow-y: auto;
  }
  #kpi-root.repeat.repeat-row {
    grid-auto-flow: column;
    grid-auto-columns: minmax(130px, 1fr);
    grid-template-columns: none;
    grid-template-rows: minmax(0, 1fr);
    overflow-x: auto; overflow-y: hidden;
  }
  .kpi-card {
    display: flex;
    flex-direction: column;
    justify-content: center;
    box-sizing: border-box;
    min-width: 0; min-height: 0;
    overflow: hidden;
    container-type: inline-size;
    padding: var(--pd-card-padding);
    background: var(--pd-card-bg);
    border: var(--pd-card-border-width) solid var(--pd-card-border-color);
    border-radius: var(--pd-card-radius);
    box-shadow: var(--pd-card-shadow);
  }
  #kpi-root.align-center .kpi-card { align-items: center; text-align: center; }
  #kpi-root.align-left .kpi-card { align-items: flex-start; text-align: left; }

  .kpi-body { display: flex; flex-direction: column; min-width: 0; max-width: 100%; }
  #kpi-root.align-center .kpi-body { align-items: center; }
  #kpi-root.align-left .kpi-body { align-items: flex-start; }

  /* ícone opcional (tile arredondado ou solto), à esquerda ou acima do valor */
  .kpi-icon { display: none; flex: 0 0 auto; align-items: center; justify-content: center; color: var(--pd-accent-1); }
  #kpi-root.has-icon .kpi-icon { display: flex; }
  .kpi-icon svg { width: 55%; height: 55%; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .kpi-icon.tile { border-radius: 12px; background: rgba(128, 128, 128, 0.12); background: color-mix(in srgb, currentColor 14%, transparent); }
  .kpi-icon.plain svg { width: 100%; height: 100%; }
  #kpi-root.size-small .kpi-icon { width: 30px; height: 30px; }
  #kpi-root.size-medium .kpi-icon { width: 42px; height: 42px; }
  #kpi-root.size-large .kpi-icon { width: 56px; height: 56px; }
  #kpi-root.has-icon.icon-left .kpi-card { flex-direction: row; align-items: center; gap: 14px; }
  #kpi-root.has-icon.icon-left.align-center .kpi-card { justify-content: center; }
  #kpi-root.has-icon.icon-top .kpi-icon { margin-bottom: 8px; }

  /* legenda embaixo do valor em vez de em cima */
  #kpi-root.label-bottom .kpi-label { order: 2; margin-bottom: 0; margin-top: 4px; }

  .kpi-label {
    max-width: 100%;
    font-size: var(--pd-title-size); font-weight: var(--pd-title-weight); color: var(--pd-text-muted);
    text-transform: var(--pd-title-transform); letter-spacing: var(--pd-title-spacing); margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kpi-label.hidden { display: none !important; }

  .kpi-value {
    max-width: 100%;
    font-weight: 700; color: var(--pd-accent-1);
    line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #kpi-root.accent-laranja .kpi-value { color: var(--pd-accent-2); }
  #kpi-root.accent-amarelo .kpi-value { color: var(--pd-accent-3); }
  #kpi-root.accent-azul-escuro .kpi-value { color: var(--pd-accent-4); }
  #kpi-root.accent-laranja .kpi-icon { color: var(--pd-accent-2); }
  #kpi-root.accent-amarelo .kpi-icon { color: var(--pd-accent-3); }
  #kpi-root.accent-azul-escuro .kpi-icon { color: var(--pd-accent-4); }
  /* uma cor por card (série do tema) */
  #kpi-root .kpi-card.colored .kpi-value, #kpi-root .kpi-card.colored .kpi-icon { color: var(--kpi-color); }

  /* tamanho relativo à largura do card (cqw); vw fica de reserva para navegadores sem container queries */
  #kpi-root.size-small .kpi-value { font-size: clamp(14px, 5vw, 24px); font-size: clamp(14px, 9cqw, 24px); }
  #kpi-root.size-medium .kpi-value { font-size: clamp(20px, 8vw, 40px); font-size: clamp(18px, 13cqw, 40px); }
  #kpi-root.size-large .kpi-value { font-size: clamp(28px, 11vw, 56px); font-size: clamp(22px, 17cqw, 56px); }

  .kpi-variation {
    max-width: 100%;
    font-size: 13px; font-weight: 700; margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .kpi-variation.hidden { display: none !important; }
  .kpi-variation.up { color: var(--pd-positive); }
  .kpi-variation.down { color: var(--pd-negative); }
  .kpi-variation.flat { color: var(--pd-text-muted); }
  .pd-tip {
    position: fixed; z-index: 9999; pointer-events: none; display: none;
    max-width: 260px; box-sizing: border-box; padding: 8px 12px;
    font-family: var(--pd-font); font-size: 12px; line-height: 1.35; color: var(--pd-text);
    background: var(--pd-tooltip-bg, var(--pd-surface));
    border: 1px solid var(--pd-tooltip-border, var(--pd-card-border-color));
    border-radius: var(--pd-tooltip-radius, 6px);
    box-shadow: var(--pd-tooltip-shadow, 0 6px 18px rgba(0,0,0,.35));
  }
  .pd-tip.on { display: block; }
  .pd-tip .tt-h { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .pd-tip .tt-h i { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  .pd-tip .tt-c { margin-top: 3px; font-size: 11px; color: var(--pd-text-muted); }
  .pd-tip .tt-v { margin-top: 2px; font-size: 15px; font-weight: 700; }
</style>
</head>
<body>

<div id="kpi-root" class="size-medium align-left"></div>

<script>
(function () {
  var root = document.getElementById('kpi-root');

  var ACCENT_CLASSES = ['accent-laranja', 'accent-amarelo', 'accent-azul-escuro'];
  var SIZE_CLASSES = ['size-small', 'size-medium', 'size-large'];
  var ALIGN_CLASSES = ['align-left', 'align-center'];
  var LAYOUT_CLASSES = ['icon-left', 'icon-top', 'label-bottom', 'has-icon', 'repeat', 'repeat-row'];
  var SERIES_COUNT = 8;

  // Ícones de traço (24×24)
  var ICONS = {
    'trend-down': '<polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/>',
    'trend-up': '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
    'exit': '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>',
    'users': '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    'user': '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    'dollar': '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    'cart': '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
    'bars': '<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',
    'percent': '<line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
    'target': '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    'clock': '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    'package': '<line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
    'truck': '<rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
    'star': '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    'alert': '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    'heart': '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
    'briefcase': '<rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
    'activity': '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>'
  };

  var state = {
    accent: '', customLabel: '', showLabel: true,
    icon: '', iconStyle: 'tile', iconPosition: 'left', labelPosition: 'top', iconColor: '',
    prefix: '', suffix: '', valueField: '', prefixField: '', suffixField: '',
    compareField: '', displayUnits: '',
    repeatField: '', repeatColumns: '', repeatSort: '', repeatMax: '', repeatTotal: false, repeatColors: false,
    fontSize: 'size-medium', align: 'align-left',
    bgColor: '',
    borderColor: '', borderWidth: 0, borderRadius: 0
  };
  // itens do último carregamento: { label, formatted, raw, compareRaw, compareFormatted, prefix, suffix, total }
  var lastItems = null;

  var DISPLAY_UNITS = {
    K: { divisor: 1e3, suffix: ' K' },
    M: { divisor: 1e6, suffix: ' M' },
    B: { divisor: 1e9, suffix: ' B' },
    T: { divisor: 1e12, suffix: ' T' }
  };

  function formatDisplayValue(item) {
    var unit = DISPLAY_UNITS[state.displayUnits];
    if (!unit || item.raw == null) return item.formatted;
    var divided = (item.raw / unit.divisor).toLocaleString('pt-BR', {
      minimumFractionDigits: 1, maximumFractionDigits: 1
    });
    return divided + unit.suffix;
  }

  function numberOf(cell) {
    var raw = cell ? cell.value : null;
    return (typeof raw === 'number' && !isNaN(raw)) ? raw : null;
  }

  // Formata uma soma no mesmo padrão de um valor já formatado pelo Tableau (ex.: "R$ 1.234,50", "12%")
  function formatLike(sample, n) {
    var m = /^([^\d-]*)(-?[\d.,\s]*\d)(.*)$/.exec(sample || '');
    var dec = m && /,(\d{1,2})$/.exec(m[2]);
    var digits = dec ? dec[1].length : 0;
    var num = n.toLocaleString('pt-BR', { minimumFractionDigits: digits, maximumFractionDigits: digits });
    return m ? m[1] + num + m[3] : num;
  }

  function variationOf(item) {
    if (!state.compareField || item.raw == null || item.compareRaw == null || item.compareRaw === 0) return null;
    var diffPct = ((item.raw - item.compareRaw) / Math.abs(item.compareRaw)) * 100;
    return {
      text: (diffPct > 0 ? '▲' : (diffPct < 0 ? '▼' : '—')) + ' ' + Math.abs(diffPct).toFixed(1).replace('.', ',') + '%',
      cls: diffPct > 0 ? 'up' : (diffPct < 0 ? 'down' : 'flat')
    };
  }

  function el(cls, text) {
    var d = document.createElement('div');
    d.className = cls;
    if (text != null) d.textContent = text;
    return d;
  }

  function buildCard(item, index) {
    var card = el('kpi-card');
    var iconPath = ICONS[state.icon];
    if (iconPath) {
      var icon = el('kpi-icon ' + (state.iconStyle === 'plain' ? 'plain' : 'tile'));
      icon.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + iconPath + '</svg>';
      icon.style.color = state.iconColor || '';
      card.appendChild(icon);
    }
    var body = el('kpi-body');
    var label = el('kpi-label', item.label);
    if (state.showLabel === false) label.classList.add('hidden');
    body.appendChild(label);
    var prefix = state.prefixField ? (item.prefix || '') : (state.prefix || '');
    var suffix = state.suffixField ? (item.suffix || '') : (state.suffix || '');
    body.appendChild(el('kpi-value', item.status ? item.formatted : prefix + formatDisplayValue(item) + suffix));
    var variation = item.status ? null : variationOf(item);
    if (variation) body.appendChild(el('kpi-variation ' + variation.cls, variation.text));
    card.appendChild(body);

    // cor da série: cards da repetição (o total fica com a cor de destaque)
    if (state.repeatColors && state.repeatField && !item.total && index != null) {
      card.classList.add('colored');
      card.style.setProperty('--kpi-color', 'var(--pd-series-' + ((index % SERIES_COUNT) + 1) + ')');
    }
    card.style.background = state.bgColor || '';
    var borderWidth = parseInt(state.borderWidth, 10) || 0;
    card.style.border = borderWidth > 0 ? (borderWidth + 'px solid ' + (state.borderColor || '#000000')) : '';
    var borderRadius = parseInt(state.borderRadius, 10) || 0;
    card.style.borderRadius = borderRadius > 0 ? (borderRadius + 'px') : '';

    if (!item.status) {
      var lines = [item.label + ': ' + prefix + item.formatted + suffix];
      if (state.compareField && item.compareFormatted) lines.push(state.compareField + ': ' + item.compareFormatted);
      if (variation) lines.push(variation.text);
      card.title = lines.join('\n');
    }
    return card;
  }

  function applyLayout() {
    ACCENT_CLASSES.concat(SIZE_CLASSES, ALIGN_CLASSES, LAYOUT_CLASSES).forEach(function (c) { root.classList.remove(c); });
    // accent pode ser uma classe do tema ou uma cor personalizada (#RRGGBB)
    var customAccent = state.accent && state.accent.charAt(0) === '#';
    if (state.accent && !customAccent) root.classList.add(state.accent);
    if (customAccent) root.style.setProperty('--pd-accent-1', state.accent);
    else root.style.removeProperty('--pd-accent-1');
    root.classList.add(state.fontSize || 'size-medium');
    root.classList.add(state.align || 'align-left');
    if (ICONS[state.icon]) {
      root.classList.add('has-icon');
      root.classList.add(state.iconPosition === 'top' ? 'icon-top' : 'icon-left');
    }
    if (state.labelPosition === 'bottom') root.classList.add('label-bottom');
    render();
  }

  function render() {
    if (!lastItems) return;
    root.innerHTML = '';
    // grade de cards quando há "Repetir por" (mensagens de estado ocupam o card inteiro)
    var repeat = !!state.repeatField && !lastItems[0].status;
    var cols = parseInt(state.repeatColumns, 10);
    root.classList.toggle('repeat', repeat);
    root.classList.toggle('repeat-row', repeat && state.repeatColumns === 'row');
    root.style.gridTemplateColumns = !repeat || state.repeatColumns === 'row' ? ''
      : (cols > 0 ? 'repeat(' + cols + ', minmax(0, 1fr))' : 'repeat(auto-fit, minmax(min(100%, 150px), 1fr))');
    var n = 0;
    lastItems.forEach(function (item) {
      root.appendChild(buildCard(item, item.total ? null : n++));
    });
  }

  // mensagem de estado (carregando, erro, sem dados) num único card
  function showStatus(label, value) {
    lastItems = [{ label: label, formatted: value == null ? '—' : value, status: true }];
    render();
  }

  function loadState() {
    try {
      var saved = tableau.extensions.settings.get('projedataKpiState');
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch (e) { /* sem config salva ainda */ }
    applyLayout();
  }

  function colIndex(columns, fieldName) {
    if (!fieldName) return -1;
    return columns.findIndex(function (c) { return c.fieldName === fieldName; });
  }

  function cellText(row, idx) {
    return idx !== -1 && row[idx] ? row[idx].formattedValue : '';
  }

  // um KPI por valor do campo "Repetir por"; linhas repetidas do mesmo valor são somadas
  function buildRepeatItems(sumData, valueIdx, repeatIdx, compareIdx, prefixIdx, suffixIdx, totalLabel) {
    var groups = [];
    var byKey = {};
    sumData.data.forEach(function (row) {
      var key = cellText(row, repeatIdx);
      var g = byKey[key];
      if (!g) {
        g = byKey[key] = { label: key || '(vazio)', rows: 0, raw: null, compareRaw: null, formatted: cellText(row, valueIdx),
          compareFormatted: cellText(row, compareIdx), prefix: cellText(row, prefixIdx), suffix: cellText(row, suffixIdx) };
        groups.push(g);
      }
      g.rows++;
      var v = numberOf(row[valueIdx]);
      if (v != null) g.raw = (g.raw || 0) + v;
      var c = compareIdx === -1 ? null : numberOf(row[compareIdx]);
      if (c != null) g.compareRaw = (g.compareRaw || 0) + c;
    });
    groups.forEach(function (g) {
      if (g.rows > 1 && g.raw != null) g.formatted = formatLike(g.formatted, g.raw);
      if (g.rows > 1 && g.compareRaw != null) g.compareFormatted = formatLike(g.compareFormatted, g.compareRaw);
    });

    var total = null;
    if (state.repeatTotal && groups.length) {
      total = { label: totalLabel, total: true, raw: null, compareRaw: null, prefix: groups[0].prefix, suffix: groups[0].suffix };
      groups.forEach(function (g) {
        if (g.raw != null) total.raw = (total.raw || 0) + g.raw;
        if (g.compareRaw != null) total.compareRaw = (total.compareRaw || 0) + g.compareRaw;
      });
      total.formatted = total.raw == null ? '—' : formatLike(groups[0].formatted, total.raw);
      total.compareFormatted = total.compareRaw == null ? '' : formatLike(groups[0].compareFormatted, total.compareRaw);
    }

    if (state.repeatSort === 'desc' || state.repeatSort === 'asc') {
      var dir = state.repeatSort === 'desc' ? -1 : 1;
      groups.sort(function (a, b) {
        if (a.raw == null) return 1;
        if (b.raw == null) return -1;
        return (a.raw - b.raw) * dir;
      });
    } else if (state.repeatSort === 'label') {
      groups.sort(function (a, b) { return a.label.localeCompare(b.label, 'pt-BR', { numeric: true }); });
    }
    var max = parseInt(state.repeatMax, 10);
    if (max > 0) groups = groups.slice(0, max);
    return total ? [total].concat(groups) : groups;
  }

  var loadTimeoutId = null;
  function updateKpi() {
    if (!lastItems || lastItems[0].status) showStatus('Carregando...');
    console.log('[Projedata KPI] iniciando leitura de dados...');

    if (loadTimeoutId) clearTimeout(loadTimeoutId);
    loadTimeoutId = setTimeout(function () {
      showStatus('Tempo excedido — abra o console (F12)');
      console.warn('[Projedata KPI] getSummaryDataAsync não respondeu em 8s.');
    }, 8000);

    var worksheet = tableau.extensions.worksheetContent.worksheet;
    worksheet.getSummaryDataAsync({ ignoreSelection: true }).then(function (sumData) {
      clearTimeout(loadTimeoutId);
      console.log('[Projedata KPI] dados recebidos:', sumData);

      if (!sumData || !sumData.columns || sumData.columns.length === 0) {
        showStatus('Arraste um campo para as Marcas');
        return;
      }

      var columns = sumData.columns;
      var repeatIdx = colIndex(columns, state.repeatField);
      // sem campo escolhido, prefere a primeira medida (numérica); só usa a 1ª coluna se não houver nenhuma
      var valueIdx = colIndex(columns, state.valueField);
      if (valueIdx === -1) {
        valueIdx = columns.findIndex(function (c, i) { return i !== repeatIdx && (c.dataType === 'int' || c.dataType === 'float'); });
        if (valueIdx === -1) valueIdx = repeatIdx === 0 && columns.length > 1 ? 1 : 0;
      }
      var columnName = columns[valueIdx].fieldName;
      var label = (state.customLabel && state.customLabel.trim() !== '') ? state.customLabel : columnName;

      if (!sumData.data || sumData.data.length === 0) {
        lastItems = [{ label: label, formatted: 'Sem dados', status: true }];
        render();
        return;
      }

      var compareIdx = colIndex(columns, state.compareField);
      var prefixIdx = colIndex(columns, state.prefixField);
      var suffixIdx = colIndex(columns, state.suffixField);
      if (state.repeatField && repeatIdx === -1) {
        console.warn('[Projedata KPI] campo "Repetir por" não está nas Marcas:', state.repeatField);
      }

      if (repeatIdx !== -1) {
        lastItems = buildRepeatItems(sumData, valueIdx, repeatIdx, compareIdx, prefixIdx, suffixIdx, label);
      } else {
        var row = sumData.data[0];
        lastItems = [{
          label: label, formatted: row[valueIdx].formattedValue, raw: numberOf(row[valueIdx]),
          compareRaw: compareIdx === -1 ? null : numberOf(row[compareIdx]), compareFormatted: cellText(row, compareIdx),
          prefix: cellText(row, prefixIdx), suffix: cellText(row, suffixIdx)
        }];
      }
      render();
    }).catch(function (err) {
      clearTimeout(loadTimeoutId);
      console.error('[Projedata KPI] erro ao ler dados da planilha:', err);
      showStatus('Erro: ' + (err && (err.message || err.toString()) || 'ver console (F12)'));
    });
  }

  function openConfigDialog() {
    var popupUrl = 'https://renatoheinzen.github.io/tableau-skin/html/kpi-config.html';
    tableau.extensions.ui.displayDialogAsync(popupUrl, '', { height: 680, width: 340 })
      .then(function () {
        // Dialog fechou normalmente (salvou) — recarrega estado e dado
        loadState();
        updateKpi();
      })
      .catch(function (error) {
        // ErrorCodes.DialogClosedByUser é disparado quando o usuário fecha sem salvar — ignorar
        console.log('[Projedata KPI] dialog fechado:', error && error.message);
      });
  }

  showStatus('Carregando...');

  if (typeof tableau === 'undefined' || !tableau.extensions) {
    showStatus('Falha ao carregar script da API do Tableau');
    console.error('[Projedata KPI] window.tableau não existe — o script tableau.extensions.1.latest.js não carregou.');
    return;
  }

  var initTimeoutId = setTimeout(function () {
    showStatus('Timeout: initializeAsync não respondeu em 15s');
    console.warn('[Projedata KPI] initializeAsync não respondeu — normal se aberto fora do Tableau.');
  }, 15000);

  try {
    tableau.extensions.initializeAsync({ configure: openConfigDialog }).then(function () {
      clearTimeout(initTimeoutId);
      loadState();
      var worksheet = tableau.extensions.worksheetContent.worksheet;
      worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, updateKpi);
      updateKpi();
    }).catch(function (err) {
      clearTimeout(initTimeoutId);
      showStatus('Erro no initializeAsync: ' + (err && (err.message || err.toString()) || 'desconhecido'));
      console.warn('Extensions API não inicializou:', err);
    });
  } catch (syncErr) {
    clearTimeout(initTimeoutId);
    showStatus('Erro síncrono: ' + (syncErr && syncErr.message || syncErr));
    console.error('[Projedata KPI] erro síncrono ao chamar initializeAsync:', syncErr);
  }
})();
</script>


<script>
// dica de ferramenta própria: converte title (HTML) e <title> (SVG) em um cartão estilizado
(function () {
  var tip = document.createElement('div');
  tip.className = 'pd-tip';
  document.body.appendChild(tip);
  function textOf(n) {
    if (n.namespaceURI === 'http://www.w3.org/2000/svg') {
      for (var i = 0; i < n.children.length; i++) {
        if (n.children[i].localName === 'title') { var t = n.children[i].textContent; n.removeChild(n.children[i]); n.setAttribute('data-tip', t); break; }
      }
    } else if (n.hasAttribute && n.hasAttribute('title')) {
      n.setAttribute('data-tip', n.getAttribute('title')); n.removeAttribute('title');
    }
    return n.getAttribute ? n.getAttribute('data-tip') : null;
  }
  function find(t) {
    for (var n = t; n && n !== document.body; n = n.parentNode) { if (n.nodeType === 1 && textOf(n)) return n; }
    return null;
  }
  function color() { return ''; }
  function add(cls, txt) { var d = document.createElement('div'); d.className = cls; d.textContent = txt; tip.appendChild(d); }
  function show(n, e) {
    var lines = n.getAttribute('data-tip').split('\n'), head = lines[0], cat = '', val = '', m;
    if ((m = /^(.*?) · (.*): ([^:]*)$/.exec(head))) { head = m[1]; cat = m[2]; val = m[3]; }
    else if ((m = /^(.*): ([^:]*)$/.exec(head))) { head = m[1]; val = m[2]; }
    tip.innerHTML = '';
    var h = document.createElement('div'); h.className = 'tt-h';
    var c = color(n);
    if (c) { var sw = document.createElement('i'); sw.style.background = c; h.appendChild(sw); }
    var nm = document.createElement('span'); nm.textContent = head; h.appendChild(nm); tip.appendChild(h);
    if (cat) add('tt-c', cat);
    if (val) add('tt-v', val);
    lines.slice(1).forEach(function (l) { add('tt-c', l); });
    tip.classList.add('on'); move(e);
  }
  function move(e) {
    var w = tip.offsetWidth, h = tip.offsetHeight, x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > window.innerWidth - 4) x = e.clientX - w - 14;
    if (y + h > window.innerHeight - 4) y = e.clientY - h - 14;
    tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
  }
  document.addEventListener('mouseover', function (e) { var n = find(e.target); if (n) show(n, e); else tip.classList.remove('on'); });
  document.addEventListener('mousemove', function (e) { if (tip.classList.contains('on')) { var n = find(e.target); if (n) move(e); else tip.classList.remove('on'); } });
  document.addEventListener('mouseleave', function () { tip.classList.remove('on'); });
})();
</script>
