<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projedata Skin Iniflex Pro</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<script src="../assets/pd-theme.js"></script>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #skin-root {
    width: 100%;
    height: 100%;
    position: relative;
    background-color: #0C0F3D;
    background-image: none;
    background-size: cover;
    background-position: center;
  }
  #logo {
    position: absolute;
    top: 32px;
    left: 16px;
    max-width: 180px;
    max-height: 70px;
  }
</style>
</head>
<body>
<div id="skin-root">
  <img id="logo" alt="">
</div>
<script>
  // base = tema do tokens.css; alt = tema alternativo (seletor claro/escuro), ou null
  var THEMES = {
    base: { color: '#0C0F3D', layers: 'none', overlay: '', bgUrl: '', logoUrl: '' },
    alt: {"color":"#EBF0F5","layers":"none","overlay":"rgba(209, 216, 237, 0.55)","bgUrl":"","logoUrl":""}
  };

  var root = document.getElementById('skin-root');
  var logo = document.getElementById('logo');
  var current = 0;

  function loadFresh(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error('not found');
      return r.blob();
    }).then(function (blob) {
      return URL.createObjectURL(blob);
    });
  }

  function applySkin(mode) {
    var t = (mode === 'alt' && THEMES.alt) ? THEMES.alt : THEMES.base;
    var token = ++current; // ignora respostas de uma troca anterior
    root.style.backgroundColor = t.color;
    root.style.backgroundImage = t.layers;

    if (t.bgUrl) {
      loadFresh(t.bgUrl).then(function (objectUrl) {
        if (token !== current) return;
        // o overlay tonaliza a imagem pra ela nunca ficar branco puro,
        // senão os cards brancos dos KPIs/gráficos perdem a borda
        var layers = 'url(' + objectUrl + ')';
        if (t.overlay) layers = 'linear-gradient(' + t.overlay + ', ' + t.overlay + '), ' + layers;
        // a imagem fica por cima do degradê/manchas
        root.style.backgroundImage = layers + (t.layers && t.layers !== 'none' ? ', ' + t.layers : '');
      }).catch(function () {
        // sem imagem de fundo definida ainda, mantém a cor sólida
      });
    }

    if (t.logoUrl) {
      loadFresh(t.logoUrl).then(function (objectUrl) {
        if (token !== current) return;
        logo.src = objectUrl;
        logo.style.display = '';
      }).catch(function () {
        logo.style.display = 'none';
      });
    } else {
      logo.style.display = 'none';
    }
  }

  applySkin('base');
  if (window.PDTheme) {
    PDTheme.onChange(applySkin);
    if (PDTheme.mode() === 'alt') applySkin('alt');
  }

  if (typeof tableau !== 'undefined' && tableau.extensions) {
    tableau.extensions.initializeAsync().then(function () {
      if (window.PDTheme) PDTheme.start();
    }).catch(function (err) {
      console.warn('[Projedata Skin Iniflex Pro] initializeAsync não respondeu (normal se aberto fora do Tableau):', err);
    });
  }
</script>
</body>
</html>
