<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projedata Map Card</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<style>
  :root {
    --azul-escuro: #0C0F3D;
    --azul: #3246FF;
    --laranja: #FE5000;
    --amarelo: #FFB400;
    --cinza-claro: #EBF0F5;
    --cinza: #F6F6F6;
    --branco: #FFFFFF;
    --preto: #161616;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: 'Montserrat', Arial, sans-serif;
    overflow: hidden;
    background: var(--cinza);
  }
  #map-root {
    width: 100%; height: 100%;
    box-sizing: border-box;
    position: relative;
  }
  #map-status {
    position: absolute; top: 8px; left: 12px;
    font-size: 12px; color: #6b7280; z-index: 1000;
    background: rgba(255,255,255,0.9);
    padding: 3px 8px; border-radius: 4px;
  }
  #map-canvas { width: 100%; height: 100%; background: #E8ECF0; }

  .leaflet-interactive.state-shape {
    stroke: var(--branco);
    stroke-width: 1;
    transition: fill-opacity 0.1s;
  }
  .leaflet-interactive.state-shape:hover { fill-opacity: 0.75 !important; }

  .projedata-tooltip {
    background: var(--azul-escuro) !important;
    color: var(--branco) !important;
    border: none !important;
    border-radius: 4px !important;
    font-size: 12px !important;
    font-family: 'Montserrat', Arial, sans-serif;
    padding: 6px 10px !important;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25) !important;
  }
  .projedata-tooltip::before { display: none !important; }
  .projedata-tooltip .tt-title { font-weight: 700; margin-bottom: 2px; }
  .projedata-tooltip .tt-value { color: #C9D0FF; }

  #map-legend {
    position: absolute; right: 10px; bottom: 10px;
    background: rgba(255,255,255,0.92);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 10px;
    color: #6b7280;
    z-index: 1000;
  }
  #map-legend.hidden { display: none !important; }
  #map-legend .legend-bar {
    width: 100px; height: 8px; border-radius: 4px; margin-bottom: 3px;
  }
  #map-legend .legend-labels { display: flex; justify-content: space-between; }

  #map-unknown {
    position: absolute; right: 10px; top: 8px;
    background: rgba(0,0,0,0.55);
    color: var(--branco);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    z-index: 1000;
  }
  #map-unknown.hidden { display: none !important; }

  .leaflet-control-attribution { font-size: 9px !important; }
</style>
</head>
<body>

<div id="map-root">
  <div id="map-status">Carregando...</div>
  <div id="map-canvas"></div>
  <div id="map-legend" class="hidden">
    <div class="legend-bar" id="legend-bar"></div>
    <div class="legend-labels"><span id="legend-min">0</span><span id="legend-max">0</span></div>
  </div>
  <div id="map-unknown" class="hidden"></div>
</div>

<script>
(function () {
  var statusEl = document.getElementById('map-status');
  var legendEl = document.getElementById('map-legend');
  var legendBar = document.getElementById('legend-bar');
  var legendMin = document.getElementById('legend-min');
  var legendMax = document.getElementById('legend-max');
  var unknownEl = document.getElementById('map-unknown');

  var ACCENT_COLORS = {
    '': '#3246FF',
    'accent-laranja': '#FE5000',
    'accent-azul-escuro': '#0C0F3D'
  };
  var LOW_COLOR = [235, 240, 245]; // --cinza-claro

  var state = { accent: '', showLegend: true, countryField: '', regionField: '' };
  var geoData = null;
  var geoIndex = null;  // "normCountry|normRegion" -> feature
  var map = null;
  var geoLayer = null;
  var hasFitOnce = false;
  var pendingFitBounds = null;

  function stripAccents(s) {
    return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
  }
  function normKey(s) {
    return stripAccents(String(s || '')).toLowerCase().trim();
  }
  function regionKey(props) {
    return (props.country_code || '') + '|' + (props.sigla || props.name || '');
  }

  function loadGeo() {
    return fetch('geo/world-admin1.json').then(function (r) { return r.json(); }).then(function (geo) {
      geoData = geo;
      geoIndex = {};
      geo.features.forEach(function (f) {
        var countryCands = [normKey(f.properties.country_code), normKey(f.properties.country)];
        var regionCands = [normKey(f.properties.sigla), normKey(f.properties.name)];
        countryCands.forEach(function (cc) {
          if (!cc) return;
          regionCands.forEach(function (rc) {
            if (!rc) return;
            geoIndex[cc + '|' + rc] = f;
          });
        });
      });
    });
  }

  function initMap() {
    map = L.map('map-canvas', {
      zoomControl: true,
      scrollWheelZoom: false,
      attributionControl: true
    }).setView([-15, -55], 2);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors',
      maxZoom: 18
    }).addTo(map);

    var resizeObserver = new ResizeObserver(function () {
      map.invalidateSize();
      tryInitialFit();
    });
    resizeObserver.observe(document.getElementById('map-canvas'));
  }

  function tryInitialFit() {
    if (hasFitOnce || !pendingFitBounds) return;
    var size = map.getSize();
    if (size.x > 0 && size.y > 0) {
      fitToData();
      hasFitOnce = true;
    }
  }

  function lerpColor(t) {
    var end = hexToRgb(ACCENT_COLORS[state.accent] || ACCENT_COLORS['']);
    var r = Math.round(LOW_COLOR[0] + (end[0] - LOW_COLOR[0]) * t);
    var g = Math.round(LOW_COLOR[1] + (end[1] - LOW_COLOR[1]) * t);
    var b = Math.round(LOW_COLOR[2] + (end[2] - LOW_COLOR[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function hexToRgb(hex) {
    var v = parseInt(hex.replace('#', ''), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  function fitToData() {
    if (!pendingFitBounds) return;
    map.invalidateSize({ animate: false });
    map.fitBounds(pendingFitBounds, { padding: [12, 12], maxZoom: 6, animate: false });
  }

  function renderMap(dataByState, minVal, maxVal, unknownCount) {
    if (geoLayer) { map.removeLayer(geoLayer); geoLayer = null; }

    pendingFitBounds = null;

    geoLayer = L.geoJSON(geoData, {
      className: 'state-shape',
      filter: function (feature) {
        // skip regions with no data to keep the overlay light on a world-sized dataset
        return !!dataByState[regionKey(feature.properties)];
      },
      style: function (feature) {
        var entry = dataByState[regionKey(feature.properties)];
        var t = maxVal > minVal ? (entry.value - minVal) / (maxVal - minVal) : 1;
        return { fillColor: lerpColor(t), fillOpacity: 0.85, weight: 1, color: '#FFFFFF' };
      },
      onEachFeature: function (feature, layer) {
        var entry = dataByState[regionKey(feature.properties)];
        var title = feature.properties.name + ', ' + feature.properties.country;
        layer.bindTooltip(
          '<div class="tt-title">' + title + '</div><div class="tt-value">' + entry.formattedValue + '</div>',
          { className: 'projedata-tooltip', sticky: true, direction: 'top' }
        );
        pendingFitBounds = pendingFitBounds ? pendingFitBounds.extend(layer.getBounds()) : L.latLngBounds(layer.getBounds());
      }
    }).addTo(map);

    tryInitialFit();
    setTimeout(tryInitialFit, 400);
    setTimeout(tryInitialFit, 1200);

    legendEl.classList.toggle('hidden', !state.showLegend);
    var accentHex = ACCENT_COLORS[state.accent] || ACCENT_COLORS[''];
    legendBar.style.background = 'linear-gradient(to right, rgb(' + LOW_COLOR.join(',') + '), ' + accentHex + ')';
    legendMin.textContent = fmtCompact(minVal);
    legendMax.textContent = fmtCompact(maxVal);

    if (unknownCount > 0) {
      unknownEl.textContent = unknownCount + ' desconhecido(s)';
      unknownEl.classList.remove('hidden');
    } else {
      unknownEl.classList.add('hidden');
    }
  }

  function fmtCompact(n) {
    if (n == null || isNaN(n)) return '0';
    var abs = Math.abs(n);
    if (abs >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
    if (abs >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (abs >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(Math.round(n));
  }

  function loadState() {
    try {
      var saved = tableau.extensions.settings.get('projedataMapState');
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch (e) { /* sem config salva ainda */ }
  }

  var loadTimeoutId = null;
  function updateMap() {
    statusEl.textContent = 'Carregando...';
    statusEl.style.display = 'block';

    if (loadTimeoutId) clearTimeout(loadTimeoutId);
    loadTimeoutId = setTimeout(function () {
      statusEl.textContent = 'Tempo excedido — abra o console (F12)';
      console.warn('[Projedata Map] getSummaryDataAsync não respondeu em 8s.');
    }, 8000);

    var worksheet = tableau.extensions.worksheetContent.worksheet;
    worksheet.getSummaryDataAsync({ ignoreSelection: true }).then(function (sumData) {
      clearTimeout(loadTimeoutId);

      if (!sumData || !sumData.columns || sumData.columns.length < 3) {
        statusEl.textContent = 'Arraste País, UF/Província (Detalhe) e uma medida (Cor)';
        return;
      }

      var cols = sumData.columns;
      var stringColIdxs = [], valueColIdx = -1;
      cols.forEach(function (c, i) {
        if (c.dataType === 'float' || c.dataType === 'int') {
          if (valueColIdx === -1) valueColIdx = i;
        } else {
          stringColIdxs.push(i);
        }
      });
      if (stringColIdxs.length < 2 || valueColIdx === -1) {
        statusEl.textContent = 'Arraste País, UF/Província (Detalhe) e uma medida (Cor)';
        return;
      }
      var countryColIdx = stringColIdxs[0], regionColIdx = stringColIdxs[1];
      if (state.countryField) {
        var byName = cols.findIndex(function (c) { return c.fieldName === state.countryField; });
        if (byName !== -1) countryColIdx = byName;
      }
      if (state.regionField) {
        var byName2 = cols.findIndex(function (c) { return c.fieldName === state.regionField; });
        if (byName2 !== -1) regionColIdx = byName2;
      }

      var dataByState = {};
      var minVal = Infinity, maxVal = -Infinity;
      var unknownCount = 0;

      sumData.data.forEach(function (row) {
        var countryVal = row[countryColIdx].value;
        var regionVal = row[regionColIdx].value;
        var value = row[valueColIdx].value;
        var formattedValue = row[valueColIdx].formattedValue;
        if (value == null || isNaN(value)) return;

        var lookupKey = normKey(countryVal) + '|' + normKey(regionVal);
        var feature = geoIndex[lookupKey];
        if (!feature) { unknownCount++; return; }

        var key = regionKey(feature.properties);
        dataByState[key] = { value: value, formattedValue: formattedValue };
        if (value < minVal) minVal = value;
        if (value > maxVal) maxVal = value;
      });

      if (minVal === Infinity) { minVal = 0; maxVal = 0; }

      statusEl.style.display = 'none';
      renderMap(dataByState, minVal, maxVal, unknownCount);
    }).catch(function (err) {
      clearTimeout(loadTimeoutId);
      statusEl.textContent = 'Erro: ' + (err && (err.message || err.toString()) || 'ver console (F12)');
      statusEl.style.display = 'block';
      console.error('[Projedata Map] erro ao ler dados da planilha:', err);
    });
  }

  function openConfigDialog() {
    var popupUrl = 'https://renatoheinzen.github.io/tableau-skin/html/map-config.html';
    tableau.extensions.ui.displayDialogAsync(popupUrl, '', { height: 360, width: 340 })
      .then(function () {
        loadState();
        updateMap();
      })
      .catch(function (error) {
        console.log('[Projedata Map] dialog fechado:', error && error.message);
      });
  }

  if (typeof tableau === 'undefined' || !tableau.extensions) {
    statusEl.textContent = 'Falha ao carregar script da API do Tableau';
    console.error('[Projedata Map] window.tableau não existe.');
    return;
  }

  var initTimeoutId = setTimeout(function () {
    statusEl.textContent = 'Timeout: initializeAsync não respondeu em 15s';
    console.warn('[Projedata Map] initializeAsync não respondeu — normal se aberto fora do Tableau.');
  }, 15000);

  try {
    initMap();
    Promise.all([
      tableau.extensions.initializeAsync({ configure: openConfigDialog }),
      loadGeo()
    ]).then(function () {
      clearTimeout(initTimeoutId);
      loadState();
      var worksheet = tableau.extensions.worksheetContent.worksheet;
      worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, updateMap);
      updateMap();
    }).catch(function (err) {
      clearTimeout(initTimeoutId);
      statusEl.textContent = 'Erro ao iniciar: ' + (err && (err.message || err.toString()) || 'desconhecido');
      console.warn('[Projedata Map] erro na inicialização:', err);
    });
  } catch (syncErr) {
    clearTimeout(initTimeoutId);
    statusEl.textContent = 'Erro síncrono: ' + (syncErr && syncErr.message || syncErr);
    console.error('[Projedata Map] erro síncrono ao chamar initializeAsync:', syncErr);
  }
})();
</script>

</body>
</html>
