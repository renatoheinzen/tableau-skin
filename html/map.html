<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projedata Map Card</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<style>
  :root {
    --azul-escuro: #0C0F3D;
    --azul: #3246FF;
    --laranja: #FE5000;
    --amarelo: #FFB400;
    --cinza-claro: #EBF0F5;
    --cinza: #F6F6F6;
    --branco: #FFFFFF;
    --preto: #161616;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: 'Montserrat', Arial, sans-serif;
    overflow: hidden;
    background: var(--branco);
  }
  #map-root {
    width: 100%; height: 100%;
    box-sizing: border-box;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  #map-status {
    position: absolute; top: 8px; left: 12px;
    font-size: 12px; color: #6b7280; z-index: 2;
  }
  #map-svg-wrap { flex: 1; min-height: 0; }
  #map-svg { width: 100%; height: 100%; display: block; }

  path.state {
    stroke: var(--branco);
    stroke-width: 0.6;
    cursor: default;
    transition: opacity 0.1s;
  }
  path.state:hover { opacity: 0.75; stroke-width: 1.2; }
  path.state.no-data { fill: #E5E7EB; }

  #map-tooltip {
    position: absolute;
    pointer-events: none;
    background: var(--azul-escuro);
    color: var(--branco);
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
    z-index: 5;
    opacity: 0;
    transform: translate(-50%, -100%);
    transition: opacity 0.08s;
  }
  #map-tooltip .tt-title { font-weight: 700; margin-bottom: 2px; }
  #map-tooltip .tt-value { color: #C9D0FF; }

  #map-legend {
    position: absolute; right: 10px; bottom: 10px;
    background: rgba(255,255,255,0.9);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 10px;
    color: #6b7280;
    z-index: 3;
  }
  #map-legend.hidden { display: none !important; }
  #map-legend .legend-bar {
    width: 100px; height: 8px; border-radius: 4px; margin-bottom: 3px;
  }
  #map-legend .legend-labels { display: flex; justify-content: space-between; }

  #map-unknown {
    position: absolute; right: 10px; top: 8px;
    background: rgba(0,0,0,0.55);
    color: var(--branco);
    font-size: 10px;
    padding: 3px 8px;
    border-radius: 10px;
    z-index: 3;
  }
  #map-unknown.hidden { display: none !important; }
</style>
</head>
<body>

<div id="map-root">
  <div id="map-status">Carregando...</div>
  <div id="map-svg-wrap">
    <svg id="map-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div id="map-legend" class="hidden">
    <div class="legend-bar" id="legend-bar"></div>
    <div class="legend-labels"><span id="legend-min">0</span><span id="legend-max">0</span></div>
  </div>
  <div id="map-unknown" class="hidden"></div>
  <div id="map-tooltip"></div>
</div>

<script>
(function () {
  var root = document.getElementById('map-root');
  var statusEl = document.getElementById('map-status');
  var svg = document.getElementById('map-svg');
  var tooltip = document.getElementById('map-tooltip');
  var legendEl = document.getElementById('map-legend');
  var legendBar = document.getElementById('legend-bar');
  var legendMin = document.getElementById('legend-min');
  var legendMax = document.getElementById('legend-max');
  var unknownEl = document.getElementById('map-unknown');

  var ACCENT_COLORS = {
    '': '#3246FF',
    'accent-laranja': '#FE5000',
    'accent-azul-escuro': '#0C0F3D'
  };
  var LOW_COLOR = [235, 240, 245]; // --cinza-claro

  var state = { accent: '', showLegend: true };
  var geoFeatures = null; // parsed geojson features
  var geoByKey = null;    // normalized name/sigla -> feature

  function stripAccents(s) {
    return (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '');
  }
  function normKey(s) {
    return stripAccents(String(s || '')).toLowerCase().trim();
  }

  function loadGeo() {
    return fetch('geo/br-states.json').then(function (r) { return r.json(); }).then(function (geo) {
      geoFeatures = geo.features;
      geoByKey = {};
      geoFeatures.forEach(function (f) {
        geoByKey[normKey(f.properties.name)] = f;
        geoByKey[normKey(f.properties.sigla)] = f;
      });
    });
  }

  // Simple equirectangular projection scaled by latitude of Brazil's centroid.
  var REF_LAT_RAD = -15 * Math.PI / 180;
  function project(lon, lat) {
    return [lon * Math.cos(REF_LAT_RAD), -lat];
  }

  function ringToPoints(ring) {
    return ring.map(function (c) { return project(c[0], c[1]); });
  }

  function pathFromPolygon(coords) {
    // coords: array of rings (outer + holes), each ring array of [lon,lat]
    return coords.map(function (ring) {
      var pts = ringToPoints(ring);
      return 'M' + pts.map(function (p) { return p[0].toFixed(2) + ',' + p[1].toFixed(2); }).join('L') + 'Z';
    }).join(' ');
  }

  function featureToPathD(feature) {
    var g = feature.geometry;
    if (g.type === 'Polygon') return pathFromPolygon(g.coordinates);
    return g.coordinates.map(function (poly) { return pathFromPolygon(poly); }).join(' ');
  }

  function lerpColor(t) {
    var end = hexToRgb(ACCENT_COLORS[state.accent] || ACCENT_COLORS['']);
    var r = Math.round(LOW_COLOR[0] + (end[0] - LOW_COLOR[0]) * t);
    var g = Math.round(LOW_COLOR[1] + (end[1] - LOW_COLOR[1]) * t);
    var b = Math.round(LOW_COLOR[2] + (end[2] - LOW_COLOR[2]) * t);
    return 'rgb(' + r + ',' + g + ',' + b + ')';
  }
  function hexToRgb(hex) {
    var v = parseInt(hex.replace('#', ''), 16);
    return [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  }

  function renderMap(dataByState, minVal, maxVal, unknownCount) {
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    var xs = [], ys = [];
    var frag = document.createDocumentFragment();

    geoFeatures.forEach(function (feature) {
      var d = featureToPathD(feature);
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', d);
      path.setAttribute('class', 'state');

      var entry = dataByState[normKey(feature.properties.name)] || dataByState[normKey(feature.properties.sigla)];
      if (entry) {
        var t = maxVal > minVal ? (entry.value - minVal) / (maxVal - minVal) : 1;
        path.setAttribute('fill', lerpColor(t));
        path.dataset.name = feature.properties.name;
        path.dataset.value = entry.formattedValue;
      } else {
        path.classList.add('no-data');
        path.dataset.name = feature.properties.name;
        path.dataset.value = 'Sem dados';
      }

      path.addEventListener('mousemove', onHover);
      path.addEventListener('mouseleave', hideTooltip);
      frag.appendChild(path);

      // collect bbox
      (feature.geometry.type === 'Polygon' ? [feature.geometry.coordinates] : feature.geometry.coordinates)
        .forEach(function (poly) {
          poly.forEach(function (ring) {
            ring.forEach(function (c) {
              var p = project(c[0], c[1]);
              xs.push(p[0]); ys.push(p[1]);
            });
          });
        });
    });

    svg.appendChild(frag);

    var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
    var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
    var padX = (maxX - minX) * 0.03, padY = (maxY - minY) * 0.03;
    svg.setAttribute('viewBox', (minX - padX) + ' ' + (minY - padY) + ' ' + (maxX - minX + padX * 2) + ' ' + (maxY - minY + padY * 2));

    legendEl.classList.toggle('hidden', !state.showLegend);
    var accentHex = ACCENT_COLORS[state.accent] || ACCENT_COLORS[''];
    legendBar.style.background = 'linear-gradient(to right, rgb(' + LOW_COLOR.join(',') + '), ' + accentHex + ')';
    legendMin.textContent = fmtCompact(minVal);
    legendMax.textContent = fmtCompact(maxVal);

    if (unknownCount > 0) {
      unknownEl.textContent = unknownCount + ' desconhecido(s)';
      unknownEl.classList.remove('hidden');
    } else {
      unknownEl.classList.add('hidden');
    }
  }

  function fmtCompact(n) {
    if (n == null || isNaN(n)) return '0';
    var abs = Math.abs(n);
    if (abs >= 1e9) return (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'B';
    if (abs >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (abs >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(Math.round(n));
  }

  function onHover(evt) {
    var target = evt.currentTarget;
    var rect = root.getBoundingClientRect();
    tooltip.innerHTML = '<div class="tt-title">' + target.dataset.name + '</div><div class="tt-value">' + target.dataset.value + '</div>';
    tooltip.style.left = (evt.clientX - rect.left) + 'px';
    tooltip.style.top = (evt.clientY - rect.top - 10) + 'px';
    tooltip.style.opacity = '1';
  }
  function hideTooltip() { tooltip.style.opacity = '0'; }

  function loadState() {
    try {
      var saved = tableau.extensions.settings.get('projedataMapState');
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch (e) { /* sem config salva ainda */ }
  }

  var loadTimeoutId = null;
  function updateMap() {
    statusEl.textContent = 'Carregando...';
    statusEl.style.display = 'block';

    if (loadTimeoutId) clearTimeout(loadTimeoutId);
    loadTimeoutId = setTimeout(function () {
      statusEl.textContent = 'Tempo excedido — abra o console (F12)';
      console.warn('[Projedata Map] getSummaryDataAsync não respondeu em 8s.');
    }, 8000);

    var worksheet = tableau.extensions.worksheetContent.worksheet;
    worksheet.getSummaryDataAsync({ ignoreSelection: true }).then(function (sumData) {
      clearTimeout(loadTimeoutId);

      if (!sumData || !sumData.columns || sumData.columns.length < 2) {
        statusEl.textContent = 'Arraste um campo de UF (Detalhe) e uma medida (Cor)';
        return;
      }

      var cols = sumData.columns;
      var valueColIdx = -1, dimColIdx = -1;
      cols.forEach(function (c, i) {
        if (valueColIdx === -1 && (c.dataType === 'float' || c.dataType === 'int')) valueColIdx = i;
        else if (dimColIdx === -1) dimColIdx = i;
      });
      if (dimColIdx === -1) dimColIdx = 0;
      if (valueColIdx === -1) valueColIdx = cols.length - 1;

      var dataByState = {};
      var minVal = Infinity, maxVal = -Infinity;
      var unknownCount = 0;

      sumData.data.forEach(function (row) {
        var name = row[dimColIdx].value;
        var value = row[valueColIdx].value;
        var formattedValue = row[valueColIdx].formattedValue;
        if (value == null || isNaN(value)) return;

        var key = normKey(name);
        if (!geoByKey[key]) { unknownCount++; return; }

        dataByState[key] = { value: value, formattedValue: formattedValue };
        if (value < minVal) minVal = value;
        if (value > maxVal) maxVal = value;
      });

      if (minVal === Infinity) { minVal = 0; maxVal = 0; }

      statusEl.style.display = 'none';
      renderMap(dataByState, minVal, maxVal, unknownCount);
    }).catch(function (err) {
      clearTimeout(loadTimeoutId);
      statusEl.textContent = 'Erro: ' + (err && (err.message || err.toString()) || 'ver console (F12)');
      statusEl.style.display = 'block';
      console.error('[Projedata Map] erro ao ler dados da planilha:', err);
    });
  }

  function openConfigDialog() {
    var popupUrl = 'https://renatoheinzen.github.io/tableau-skin/html/map-config.html';
    tableau.extensions.ui.displayDialogAsync(popupUrl, '', { height: 360, width: 340 })
      .then(function () {
        loadState();
        updateMap();
      })
      .catch(function (error) {
        console.log('[Projedata Map] dialog fechado:', error && error.message);
      });
  }

  if (typeof tableau === 'undefined' || !tableau.extensions) {
    statusEl.textContent = 'Falha ao carregar script da API do Tableau';
    console.error('[Projedata Map] window.tableau não existe.');
    return;
  }

  var initTimeoutId = setTimeout(function () {
    statusEl.textContent = 'Timeout: initializeAsync não respondeu em 15s';
    console.warn('[Projedata Map] initializeAsync não respondeu — normal se aberto fora do Tableau.');
  }, 15000);

  try {
    Promise.all([
      tableau.extensions.initializeAsync({ configure: openConfigDialog }),
      loadGeo()
    ]).then(function () {
      clearTimeout(initTimeoutId);
      loadState();
      var worksheet = tableau.extensions.worksheetContent.worksheet;
      worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, updateMap);
      updateMap();
    }).catch(function (err) {
      clearTimeout(initTimeoutId);
      statusEl.textContent = 'Erro ao iniciar: ' + (err && (err.message || err.toString()) || 'desconhecido');
      console.warn('[Projedata Map] erro na inicialização:', err);
    });
  } catch (syncErr) {
    clearTimeout(initTimeoutId);
    statusEl.textContent = 'Erro síncrono: ' + (syncErr && syncErr.message || syncErr);
    console.error('[Projedata Map] erro síncrono ao chamar initializeAsync:', syncErr);
  }
})();
</script>

</body>
</html>
