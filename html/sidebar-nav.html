<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projedata Faixa Lateral</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: var(--pd-font);
    overflow: hidden;
    background: transparent;
  }
  #nav {
    width: 100%; height: 100%; box-sizing: border-box;
    display: flex; flex-direction: column;
    padding: 16px 12px;
    background: var(--pd-nav-bg); color: var(--pd-nav-text);
    border: 1px solid var(--pd-nav-border);
    border-radius: var(--pd-panel-radius);
    box-shadow: var(--pd-panel-shadow);
  }
  #brand { display: flex; align-items: center; gap: 10px; padding: 2px 6px 14px; min-width: 0; }
  #brand:empty { display: none; }
  #logo { max-height: 34px; max-width: 120px; display: none; }
  #brand-text { min-width: 0; }
  #title { font-size: 14px; font-weight: 700; letter-spacing: var(--pd-panel-title-spacing); text-transform: var(--pd-title-transform); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #subtitle { font-size: 11px; color: var(--pd-nav-muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #divider { height: 1px; background: var(--pd-nav-border); margin: 0 6px 10px; }

  #items { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; min-height: 0; }
  .item {
    display: flex; align-items: center; gap: 10px; min-width: 0;
    padding: 9px 10px; border-radius: var(--pd-nav-radius);
    font-size: 13px; color: var(--pd-nav-text); cursor: pointer; user-select: none;
  }
  .item:hover { background: rgba(128, 128, 128, 0.14); background: color-mix(in srgb, currentColor 9%, transparent); }
  .item.active { background: var(--pd-nav-active-bg); color: var(--pd-nav-active-text); font-weight: 600; }
  .item svg { flex: 0 0 18px; width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  #footer { margin-top: auto; padding: 12px 6px 0; font-size: 11px; color: var(--pd-nav-muted); }
  #footer:empty { display: none; }
</style>
</head>
<body>

<div id="nav">
  <div id="brand">
    <img id="logo" alt="">
    <div id="brand-text"><div id="title"></div><div id="subtitle"></div></div>
  </div>
  <div id="divider"></div>
  <div id="items"></div>
  <div id="footer"></div>
</div>

<script>
(function () {
  var STATE_KEY = 'projedataSidebarState';
  var LOGO_URL = '../assets/logo-dark.png';
  var navEl = document.getElementById('nav');
  var logoEl = document.getElementById('logo');
  var titleEl = document.getElementById('title');
  var subtitleEl = document.getElementById('subtitle');
  var brandEl = document.getElementById('brand');
  var dividerEl = document.getElementById('divider');
  var itemsEl = document.getElementById('items');
  var footerEl = document.getElementById('footer');

  // Ícones de traço (24×24)
  var ICONS = {
    'home': '<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
    'grid': '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
    'bars': '<line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/>',
    'trend-up': '<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>',
    'trend-down': '<polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/>',
    'users': '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    'user': '<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
    'dollar': '<line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
    'cart': '<circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>',
    'package': '<line x1="16.5" y1="9.4" x2="7.5" y2="4.21"/><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/>',
    'truck': '<rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>',
    'target': '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    'clock': '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    'calendar': '<rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>',
    'filter': '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
    'settings': '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>',
    'file': '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
    'map': '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
    'layers': '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
    'star': '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
    'alert': '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
    'heart': '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>',
    'briefcase': '<rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>',
    'activity': '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>'
  };

  var state = {
    title: '', subtitle: '', showLogo: false,
    items: 'Visão geral | home\nDesempenho | bars\nVendas | cart', activeItem: 1, parameterName: '', footer: '', bgColor: ''
  };
  var items = [];
  var active = 0;

  // Linha: Rótulo | ícone | valor (parâmetro ou link http/https)
  function parseItems(text) {
    return String(text || '').split(/\r?\n/).map(function (line) { return line.trim(); }).filter(Boolean).map(function (line) {
      var p = line.split('|').map(function (s) { return s.trim(); });
      return { label: p[0] || '', icon: p[1] || '', value: p.slice(2).join('|') };
    });
  }

  function dashboard() {
    try { return tableau.extensions.dashboardContent.dashboard; } catch (e) { return null; }
  }

  function render() {
    titleEl.textContent = state.title || '';
    subtitleEl.textContent = state.subtitle || '';
    var hasLogo = !!(state.showLogo && LOGO_URL);
    logoEl.style.display = hasLogo ? 'block' : 'none';
    if (hasLogo) logoEl.src = LOGO_URL;
    var hasBrand = hasLogo || state.title || state.subtitle;
    brandEl.style.display = hasBrand ? 'flex' : 'none';
    dividerEl.style.display = hasBrand ? 'block' : 'none';
    footerEl.textContent = state.footer || '';
    navEl.style.background = state.bgColor || '';

    itemsEl.innerHTML = '';
    items.forEach(function (it, i) {
      var el = document.createElement('div');
      el.className = 'item' + (i === active ? ' active' : '');
      if (ICONS[it.icon]) {
        el.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true">' + ICONS[it.icon] + '</svg>';
      }
      var span = document.createElement('span');
      span.textContent = it.label;
      el.appendChild(span);
      el.title = it.label;
      el.addEventListener('click', function () { activate(i); });
      itemsEl.appendChild(el);
    });
  }

  function setParameter(value) {
    var d = dashboard();
    if (!d || !state.parameterName) return;
    d.getParametersAsync().then(function (params) {
      var p = params.filter(function (x) { return x.name === state.parameterName; })[0];
      if (p) return p.changeValueAsync(value);
      console.warn('[Projedata Faixa Lateral] parâmetro não encontrado:', state.parameterName);
    }).catch(function (err) { console.warn('[Projedata Faixa Lateral] erro ao alterar o parâmetro:', err); });
  }

  function activate(i) {
    active = i;
    render();
    var v = items[i] && items[i].value;
    if (!v) return;
    if (/^https?:\/\//i.test(v)) window.open(v, '_blank', 'noopener');
    else setParameter(v);
  }

  // Mantém o item ativo igual ao valor atual do parâmetro (inclusive quando ele muda por fora)
  function syncFromParameter() {
    var d = dashboard();
    if (!d || !state.parameterName) return;
    d.getParametersAsync().then(function (params) {
      var p = params.filter(function (x) { return x.name === state.parameterName; })[0];
      if (!p) return;
      function pick() {
        var cur = String(p.currentValue && (p.currentValue.formattedValue != null ? p.currentValue.formattedValue : p.currentValue.value));
        var idx = items.findIndex(function (it) { return it.value === cur; });
        if (idx !== -1) { active = idx; render(); }
      }
      pick();
      if (typeof tableau !== 'undefined' && tableau.TableauEventType && tableau.TableauEventType.ParameterChanged) {
        p.addEventListener(tableau.TableauEventType.ParameterChanged, function (e) {
          e.getParameterAsync().then(function (np) { p = np; pick(); });
        });
      }
    }).catch(function () { /* sem parâmetros (ex.: fora do Tableau) */ });
  }

  function loadState() {
    try {
      var saved = tableau.extensions.settings.get(STATE_KEY);
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch (e) { /* sem config salva ainda */ }
    items = parseItems(state.items);
    var n = parseInt(state.activeItem, 10);
    active = !isNaN(n) && n >= 1 && n <= items.length ? n - 1 : 0;
    render();
  }

  function openConfigDialog() {
    tableau.extensions.ui.displayDialogAsync('https://renatoheinzen.github.io/tableau-skin/html/sidebar-nav-config.html', '', { height: 700, width: 340 })
      .then(function () { loadState(); syncFromParameter(); })
      .catch(function (error) {
        console.log('[Projedata Faixa Lateral] dialog fechado:', error && error.message);
      });
  }

  render();

  if (typeof tableau === 'undefined' || !tableau.extensions) {
    console.error('[Projedata Faixa Lateral] window.tableau não existe — o script tableau.extensions.1.latest.js não carregou.');
    return;
  }

  tableau.extensions.initializeAsync({ configure: openConfigDialog }).then(function () {
    loadState();
    syncFromParameter();
  }).catch(function (err) {
    console.warn('[Projedata Faixa Lateral] initializeAsync não respondeu (normal se aberto fora do Tableau):', err);
  });
})();
</script>

</body>
</html>
