<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projedata Skin Claro</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api@1.17.0/lib/tableau.extensions.1.latest.js"></script>
<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
overflow: hidden;
}
#skin-root {
width: 100%;
height: 100%;
position: relative;
background-color: #EBF0F5;
background-size: cover;
background-position: center;
}
#logo {
position: absolute;
top: 32px;
left: 16px;
max-width: 180px;
max-height: 70px;
}
</style>
</head>
<body>
<div id="skin-root">
<img id="logo" alt="">
</div>
<script>
var root = document.getElementById('skin-root');
var logo = document.getElementById('logo');
function loadFresh(url) {
return fetch(url, { cache: 'no-store' }).then(function (r) {
if (!r.ok) throw new Error('not found');
return r.blob();
}).then(function (blob) {
return URL.createObjectURL(blob);
});
}
loadFresh('../assets/background-light.jpg').then(function (objectUrl) {
root.style.backgroundImage =
'linear-gradient(rgba(209,216,237,0.55), rgba(209,216,237,0.55)), url(' + objectUrl + ')';
}).catch(function () {
});
loadFresh('../assets/logo.png').then(function (objectUrl) {
logo.src = objectUrl;
}).catch(function () {
logo.style.display = 'none';
});
if (typeof tableau !== 'undefined' && tableau.extensions) {
tableau.extensions.initializeAsync().catch(function (err) {
});
}
</script>
</body>
</html>
