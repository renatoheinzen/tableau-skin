<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projedata Gráfico de Pizza</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: var(--pd-font);
    overflow: hidden;
    background: transparent;
  }
  #chart-root {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: var(--pd-card-padding);
    background: var(--pd-card-bg);
    border: var(--pd-card-border-width) solid var(--pd-card-border-color);
    border-radius: var(--pd-card-radius);
    box-shadow: var(--pd-card-shadow);
  }
  #chart-title {
    font-size: var(--pd-title-size); font-weight: var(--pd-title-weight); color: var(--pd-text-muted);
    text-transform: var(--pd-title-transform); letter-spacing: var(--pd-title-spacing);
    margin-bottom: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #chart-title.hidden { display: none !important; }
  #chart-status { font-size: 13px; color: var(--pd-text-muted); padding: 8px 0; }

  #chart-body {
    flex: 1; min-height: 0;
    display: flex; align-items: center; gap: 16px;
  }
  #chart-body.legend-bottom { flex-direction: column; gap: 8px; }
  #chart-body.legend-none { justify-content: center; }
  #pie-wrap { flex: 1 1 0; min-width: 0; min-height: 0; height: 100%; display: flex; align-items: center; justify-content: center; }
  #pie-wrap svg { max-width: 100%; max-height: 100%; }
  #pie-wrap path { transition: opacity 0.15s ease; }
  #pie-wrap path:hover { opacity: 0.8; }
  .donut-total { font-family: var(--pd-font); font-weight: 700; fill: var(--pd-text); }
  .donut-caption { font-family: var(--pd-font); fill: var(--pd-text-muted); }

  #legend {
    flex: 0 1 auto; max-width: 45%; max-height: 100%;
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: 6px;
  }
  #chart-body.legend-bottom #legend { max-width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4px 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--pd-text); min-width: 0; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; }
  .legend-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-value { color: var(--pd-text-muted); font-weight: 700; white-space: nowrap; }
  .pd-tip {
    position: fixed; z-index: 9999; pointer-events: none; display: none;
    max-width: 260px; box-sizing: border-box; padding: 8px 12px;
    font-family: var(--pd-font); font-size: 12px; line-height: 1.35; color: var(--pd-text);
    background: var(--pd-tooltip-bg, var(--pd-surface));
    border: 1px solid var(--pd-tooltip-border, var(--pd-card-border-color));
    border-radius: var(--pd-tooltip-radius, 6px);
    box-shadow: var(--pd-tooltip-shadow, 0 6px 18px rgba(0,0,0,.35));
  }
  .pd-tip.on { display: block; }
  .pd-tip .tt-h { display: flex; align-items: center; gap: 6px; font-weight: 600; }
  .pd-tip .tt-h i { width: 8px; height: 8px; border-radius: 2px; flex: 0 0 auto; }
  .pd-tip .tt-c { margin-top: 3px; font-size: 11px; color: var(--pd-text-muted); }
  .pd-tip .tt-v { margin-top: 2px; font-size: 15px; font-weight: 700; }
  /* clique filtra o dashboard (seleção de marcas) */
  .pd-click { cursor: pointer; }
  .pd-dim { opacity: 0.35; }

  /* drill-down: barra de navegação e transição */
  #drill-bar {
    display: none; align-items: center; gap: 6px; min-width: 0;
    margin: -2px 0 6px; font-size: 11px; color: var(--pd-text-muted);
  }
  #drill-bar.on { display: flex; }
  #drill-bar button {
    font: inherit; font-weight: 600; color: var(--pd-text); cursor: pointer;
    background: transparent; border: 1px solid var(--pd-card-border-color); border-radius: 4px;
    padding: 1px 8px; line-height: 1.6;
  }
  #drill-bar button:hover { border-color: var(--pd-text-muted); }
  #drill-bar .crumb-sep { opacity: 0.6; }
  #drill-bar .crumb-cur { color: var(--pd-text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pd-drill { cursor: zoom-in; }
  .donut-back { cursor: zoom-out; }
  #pie-wrap svg.drill-in { animation: pdDrillIn 0.28s ease-out; }
  #pie-wrap svg.drill-out { animation: pdDrillOut 0.28s ease-out; }
  @keyframes pdDrillIn { from { transform: scale(0.82); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pdDrillOut { from { transform: scale(1.12); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>

<div id="chart-root">
  <div id="chart-title">Carregando...</div>
  <div id="drill-bar"></div>
  <div id="chart-body"></div>
</div>

<script>
(function () {
  var STATE_KEY = 'projedataPieState';
  var titleEl = document.getElementById('chart-title');
  var bodyEl = document.getElementById('chart-body');
  var drillBarEl = document.getElementById('drill-bar');
  var SERIES_COUNT = 8;

  var DISPLAY_UNITS = { K: [1e3, ' K'], M: [1e6, ' M'], B: [1e9, ' B'], T: [1e12, ' T'] };

  function formatCompact(v) {
    var dec = parseInt(state.decimals, 10);
    var hasDec = !isNaN(dec) && dec >= 0;
    var opts = hasDec ? { minimumFractionDigits: dec, maximumFractionDigits: dec } : { maximumFractionDigits: 1 };
    var fixed = DISPLAY_UNITS[state.displayUnits];
    if (fixed) return (v / fixed[0]).toLocaleString('pt-BR', opts) + fixed[1];
    var abs = Math.abs(v);
    if (abs >= 1e12) return (v / 1e12).toLocaleString('pt-BR', opts) + ' T';
    if (abs >= 1e9) return (v / 1e9).toLocaleString('pt-BR', opts) + ' B';
    if (abs >= 1e6) return (v / 1e6).toLocaleString('pt-BR', opts) + ' M';
    if (abs >= 1e3) return (v / 1e3).toLocaleString('pt-BR', opts) + ' K';
    return v.toLocaleString('pt-BR', opts);
  }

  // Valores: padrão = texto formatado pelo Tableau; com unidade/casas escolhidas, usa o formato compacto
  function fmtCell(cell) {
    if (!cell) return '';
    if ((state.displayUnits || state.decimals !== '') && typeof cell.value === 'number' && !isNaN(cell.value)) return formatCompact(cell.value);
    return cell.formattedValue;
  }

  var state = {
    displayUnits: '', decimals: '',
    customLabel: '', showLabel: true,
    dimensionField: '', measureField: '', drillField: '',
    donut: false, legend: 'right', showPercent: true,
    sortOrder: '', maxItems: ''
  };
  var lastRows = [];
  // drill-down: linhas brutas (nível 1 + nível 2) e o grupo aberto no momento (não é salvo nas configurações)
  var drill = { on: false, field: '', rawRows: [], group: null, groupRaw: null, anim: '' };

  function loadState() {
    try {
      var saved = tableau.extensions.settings.get(STATE_KEY);
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch (e) { /* sem config salva ainda */ }
    titleEl.classList.toggle('hidden', state.showLabel === false);
  }

  function findColumnIndex(columns, fieldName, fallback) {
    if (fieldName) {
      var idx = columns.findIndex(function (c) { return c.fieldName === fieldName; });
      if (idx !== -1) return idx;
      // o Tableau entrega cálculo agregado como AGG(nome) ou AGREG(nome), conforme o idioma: casa também sem o prefixo
      var bare = function (n) { var m = /^[^()]+\((.*)\)$/.exec(n || ''); return m ? m[1] : n; };
      idx = columns.findIndex(function (c) { return bare(c.fieldName) === bare(fieldName); });
      if (idx !== -1) return idx;
    }
    return fallback;
  }
  function defaultDimensionIndex(columns) {
    var idx = columns.findIndex(function (c) { return c.dataType === 'string'; });
    return idx !== -1 ? idx : 0;
  }
  function defaultMeasureIndex(columns, dimIdx) {
    var idx = columns.findIndex(function (c, i) {
      return i !== dimIdx && (c.dataType === 'int' || c.dataType === 'float');
    });
    if (idx !== -1) return idx;
    return dimIdx === 0 && columns.length > 1 ? 1 : 0;
  }

  function formatPct(v) { return v.toFixed(1).replace('.', ',') + '%'; }

  function polar(cx, cy, r, a) { return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }

  function slicePath(cx, cy, rOut, rIn, a0, a1) {
    var large = (a1 - a0) > Math.PI ? 1 : 0;
    var p0 = polar(cx, cy, rOut, a0), p1 = polar(cx, cy, rOut, a1);
    if (rIn > 0) {
      var q1 = polar(cx, cy, rIn, a1), q0 = polar(cx, cy, rIn, a0);
      return 'M' + p0 + ' A' + rOut + ',' + rOut + ' 0 ' + large + ' 1 ' + p1 +
             ' L' + q1 + ' A' + rIn + ',' + rIn + ' 0 ' + large + ' 0 ' + q0 + ' Z';
    }
    return 'M' + cx + ',' + cy + ' L' + p0 + ' A' + rOut + ',' + rOut + ' 0 ' + large + ' 1 ' + p1 + ' Z';
  }

  function svgEl(name, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', name);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  // soma as linhas por rótulo, aplica ordenação e limite de fatias
  function aggregate(items) {
    var map = {}, out = [];
    items.forEach(function (it) {
      var r = map[it.label];
      if (!r) { r = map[it.label] = { label: it.label, dimRaw: it.dimRaw, value: 0, formatted: it.formatted, n: 0 }; out.push(r); }
      r.value += it.value; r.n++;
    });
    out.forEach(function (r) { if (r.n > 1) r.formatted = formatCompact(r.value); });
    if (state.sortOrder === 'desc') out.sort(function (a, b) { return b.value - a.value; });
    else if (state.sortOrder === 'asc') out.sort(function (a, b) { return a.value - b.value; });
    var max = parseInt(state.maxItems, 10);
    if (!isNaN(max) && max > 0) out = out.slice(0, max);
    return out;
  }

  function currentRows() {
    if (!drill.on) return lastRows;
    if (drill.group === null) {
      return aggregate(drill.rawRows.map(function (r) { return { label: r.label, dimRaw: r.dimRaw, value: r.value, formatted: r.formatted }; }));
    }
    return aggregate(drill.rawRows.filter(function (r) { return r.label === drill.group; })
      .map(function (r) { return { label: r.subLabel, dimRaw: r.subRaw, value: r.value, formatted: r.formatted }; }));
  }

  function drillInto(row) {
    drill.group = row.label; drill.groupRaw = row.dimRaw; drill.anim = 'drill-in';
    if (state.clickFilter !== false && row.dimRaw !== null && row.dimRaw !== undefined) {
      pdWs().selectMarksByValueAsync([{ fieldName: clickDim.field, value: row.dimRaw }], tableau.SelectionUpdateType.Replace)
        .catch(function (e) { console.warn('[Projedata] seleção de marcas falhou:', e && (e.message || e)); });
    }
    render();
  }
  function drillUp() {
    if (!drill.on || drill.group === null) return;
    drill.group = null; drill.groupRaw = null; drill.anim = 'drill-out';
    if (state.clickFilter !== false) pdWs().clearSelectedMarksAsync().catch(function () {});
    render();
  }
  function bindDrill(el, row) {
    el.classList.add('pd-drill');
    el.addEventListener('click', function (ev) { ev.stopPropagation(); drillInto(row); });
  }
  // dentro de um grupo, a seleção de marcas usa grupo + subgrupo
  function bindLeaf(el, row) {
    if (drill.on && drill.group !== null) {
      pdBindClick(el, [{ fieldName: clickDim.field, value: drill.groupRaw }, { fieldName: drill.field, value: row.dimRaw }]);
    } else pdBindClick(el, row.dimRaw);
  }

  function renderDrillBar() {
    drillBarEl.innerHTML = '';
    var open = drill.on && drill.group !== null;
    drillBarEl.classList.toggle('on', open);
    if (!open) return;
    var back = document.createElement('button');
    back.type = 'button';
    back.textContent = '\u2039 Voltar';
    back.title = 'Voltar para todos os grupos';
    back.addEventListener('click', function (ev) { ev.stopPropagation(); drillUp(); });
    var sep = document.createElement('span'); sep.className = 'crumb-sep'; sep.textContent = '\u203a';
    var cur = document.createElement('span'); cur.className = 'crumb-cur'; cur.textContent = drill.group; cur.title = drill.group;
    drillBarEl.appendChild(back);
    drillBarEl.appendChild(sep);
    drillBarEl.appendChild(cur);
  }

  function render() {
    bodyEl.innerHTML = '';
    renderDrillBar();
    var rows = currentRows();
    var level1 = drill.on && drill.group === null;
    var anim = drill.anim; drill.anim = '';
    if (rows.length === 0) {
      var empty = document.createElement('div');
      empty.id = 'chart-status';
      empty.textContent = 'Sem dados';
      bodyEl.appendChild(empty);
      return;
    }

    var legendMode = state.legend || 'right';
    bodyEl.className = 'legend-' + legendMode;

    var total = rows.reduce(function (s, r) { return s + Math.max(r.value, 0); }, 0) || 1;
    var SIZE = 200, C = SIZE / 2, R_OUT = 96, R_IN = state.donut ? 58 : 0;

    var svg = svgEl('svg', { viewBox: '0 0 ' + SIZE + ' ' + SIZE, preserveAspectRatio: 'xMidYMid meet' });
    if (anim) svg.setAttribute('class', anim);
    var angle = -Math.PI / 2;
    rows.forEach(function (r, i) {
      var frac = Math.max(r.value, 0) / total;
      if (frac <= 0) return;
      var color = 'var(--pd-series-' + ((i % SERIES_COUNT) + 1) + ')';
      var path;
      if (frac >= 0.9999) {
        path = svgEl('path', {
          d: slicePath(C, C, R_OUT, R_IN, angle, angle + Math.PI) + ' ' + slicePath(C, C, R_OUT, R_IN, angle + Math.PI, angle + 2 * Math.PI),
          fill: color, 'fill-rule': 'evenodd'
        });
      } else {
        path = svgEl('path', { d: slicePath(C, C, R_OUT, R_IN, angle, angle + frac * 2 * Math.PI), fill: color });
      }
      var tip = svgEl('title');
      tip.textContent = r.label + ': ' + r.formatted + ' (' + formatPct(frac * 100) + ')' + (level1 ? '\nClique para detalhar' : '');
      path.appendChild(tip);
      if (level1) bindDrill(path, r); else bindLeaf(path, r);
      svg.appendChild(path);
      angle += frac * 2 * Math.PI;
    });

    if (state.donut) {
      var totalText = svgEl('text', { x: C, y: C + 2, 'text-anchor': 'middle', 'font-size': 26, class: 'donut-total' });
      totalText.textContent = formatCompact(total);
      var caption = svgEl('text', { x: C, y: C + 22, 'text-anchor': 'middle', 'font-size': 11, class: 'donut-caption' });
      var capText = drill.on && drill.group !== null ? drill.group : 'Total';
      caption.textContent = capText.length > 16 ? capText.slice(0, 15) + '\u2026' : capText;
      svg.appendChild(totalText);
      svg.appendChild(caption);
      if (drill.on && drill.group !== null) {
        // clicar no centro do donut volta um nível
        var hole = svgEl('circle', { cx: C, cy: C, r: R_IN - 2, fill: 'transparent', class: 'donut-back' });
        var holeTip = svgEl('title'); holeTip.textContent = 'Voltar para todos os grupos';
        hole.appendChild(holeTip);
        hole.addEventListener('click', function (ev) { ev.stopPropagation(); drillUp(); });
        svg.appendChild(hole);
      }
    }

    var wrap = document.createElement('div');
    wrap.id = 'pie-wrap';
    wrap.appendChild(svg);
    bodyEl.appendChild(wrap);

    if (legendMode !== 'none') {
      var legend = document.createElement('div');
      legend.id = 'legend';
      rows.forEach(function (r, i) {
        var item = document.createElement('div');
        item.className = 'legend-item';
        var dot = document.createElement('span');
        dot.className = 'legend-dot';
        dot.style.background = 'var(--pd-series-' + ((i % SERIES_COUNT) + 1) + ')';
        var label = document.createElement('span');
        label.className = 'legend-label';
        label.textContent = r.label;
        label.title = r.label;
        item.appendChild(dot);
        item.appendChild(label);
        if (state.showPercent !== false) {
          var pct = document.createElement('span');
          pct.className = 'legend-value';
          pct.textContent = formatPct(Math.max(r.value, 0) / total * 100);
          item.appendChild(pct);
        }
        if (level1) bindDrill(item, r); else bindLeaf(item, r);
        legend.appendChild(item);
      });
      bodyEl.appendChild(legend);
    }
    pdApplySelection();
  }

  var loadTimeoutId = null;
  /* ===== Clique seleciona a marca (filtra o dashboard) ===== */
  var clickDim = { field: '' };
  var clickSets = {}, selectedKeys = null, selCount = {}, selLoaded = false;
  function pdWs() { return tableau.extensions.worksheetContent.worksheet; }
  function pdNames(pairs) { return pairs.map(function (p) { return p.fieldName; }).join('\u0002'); }
  function pdKeyOf(pairs) { return pdNames(pairs) + '\u0003' + pairs.map(function (p) { return String(p.value); }).join('\u0001'); }
  // pares {fieldName, value} das colunas idxs de uma linha (ignora campos sem valor)
  function pdSel(cols, row, idxs) {
    var out = [];
    idxs.forEach(function (i) {
      if (i >= 0 && row[i] && row[i].value !== null && row[i].value !== undefined) out.push({ fieldName: cols[i].fieldName, value: row[i].value });
    });
    return out;
  }
  // target: valor da dimensão (usa clickDim.field) ou lista de pares {fieldName, value}
  function pdBindClick(el, target) {
    if (state.clickFilter === false || target === null || target === undefined) return;
    var pairs = Array.isArray(target) ? target : [{ fieldName: clickDim.field, value: target }];
    if (!pairs.length || !pairs[0].fieldName) return;
    var key = pdKeyOf(pairs), names = pdNames(pairs);
    clickSets[names] = pairs.map(function (p) { return p.fieldName; });
    el.setAttribute('data-pd-key', key);
    el.classList.add('pd-click');
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var T = tableau.SelectionUpdateType, ws = pdWs();
      var multi = ev.ctrlKey || ev.metaKey || ev.shiftKey;
      var already = !!(selectedKeys && selectedKeys[key]);
      var p;
      if (multi) p = ws.selectMarksByValueAsync(pairs, already ? T.Remove : T.Add);
      else if (already && selCount[names] === 1) p = ws.clearSelectedMarksAsync();
      else p = ws.selectMarksByValueAsync(pairs, T.Replace);
      p.catch(function (e) { console.warn('[Projedata] seleção de marcas falhou:', e && (e.message || e)); });
    });
  }
  function pdApplySelection() {
    var els = document.querySelectorAll('[data-pd-key]');
    for (var i = 0; i < els.length; i++) {
      var on = !!selectedKeys && !!selectedKeys[els[i].getAttribute('data-pd-key')];
      els[i].classList.toggle('pd-dim', !!selectedKeys && !on);
      els[i].classList.toggle('pd-sel', on);
    }
    if (!selLoaded && Object.keys(clickSets).length) { selLoaded = true; pdRefreshSelection(); }
  }
  function pdRefreshSelection() {
    if (state.clickFilter === false || !Object.keys(clickSets).length) return;
    pdWs().getSelectedMarksAsync().then(function (m) {
      var keys = null, counts = {}, t = m && m.data && m.data[0];
      if (t && t.data.length) {
        keys = {};
        Object.keys(clickSets).forEach(function (names) {
          var fields = clickSets[names];
          var ci = fields.map(function (f) { var k = -1; t.columns.forEach(function (c, i) { if (c.fieldName === f) k = i; }); return k; });
          if (!ci.every(function (k) { return k !== -1; })) return;
          t.data.forEach(function (r) {
            var key = names + '\u0003' + ci.map(function (k) { return String(r[k].value); }).join('\u0001');
            if (!keys[key]) { keys[key] = true; counts[names] = (counts[names] || 0) + 1; }
          });
        });
      }
      if (keys && !Object.keys(keys).length) keys = null; // seleção que não casa com as marcas desenhadas: não esmaece
      selectedKeys = keys;
      selCount = counts;
      pdApplySelection();
    }).catch(function () {});
  }
  function pdInitClick() {
    pdWs().addEventListener(tableau.TableauEventType.MarkSelectionChanged, pdRefreshSelection);
    // clique fora das marcas limpa a seleção
    document.addEventListener('click', function () {
      if (state.clickFilter !== false && selectedKeys) pdWs().clearSelectedMarksAsync().catch(function () {});
    });
    // Esc volta um nível do drill-down
    document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') drillUp(); });
    pdRefreshSelection();
  }

  function updateChart() {
    titleEl.textContent = 'Carregando...';
    if (loadTimeoutId) clearTimeout(loadTimeoutId);
    loadTimeoutId = setTimeout(function () {
      titleEl.textContent = 'Tempo excedido — abra o console (F12)';
      bodyEl.innerHTML = '';
    }, 8000);

    var worksheet = tableau.extensions.worksheetContent.worksheet;
    worksheet.getSummaryDataAsync({ ignoreSelection: true }).then(function (sumData) {
      clearTimeout(loadTimeoutId);
      if (!sumData || !sumData.columns || sumData.columns.length === 0) {
        titleEl.textContent = 'Arraste campos para as Marcas';
        bodyEl.innerHTML = '';
        return;
      }

      var dimIdx = findColumnIndex(sumData.columns, state.dimensionField, defaultDimensionIndex(sumData.columns));
      var measIdx = findColumnIndex(sumData.columns, state.measureField, defaultMeasureIndex(sumData.columns, dimIdx));

      titleEl.textContent = (state.customLabel && state.customLabel.trim() !== '')
        ? state.customLabel
        : sumData.columns[measIdx].fieldName;
      titleEl.classList.toggle('hidden', state.showLabel === false);

      clickDim.field = sumData.columns[dimIdx].fieldName;
      var drillIdx = findColumnIndex(sumData.columns, state.drillField, -1);
      drill.on = drillIdx !== -1 && drillIdx !== dimIdx && drillIdx !== measIdx;
      if (drill.on) {
        drill.field = sumData.columns[drillIdx].fieldName;
        drill.rawRows = (sumData.data || []).map(function (row) {
          var raw = row[measIdx] ? row[measIdx].value : null;
          return {
            label: row[dimIdx] ? row[dimIdx].formattedValue : '',
            dimRaw: row[dimIdx] ? row[dimIdx].value : null,
            subLabel: row[drillIdx] ? row[drillIdx].formattedValue : '',
            subRaw: row[drillIdx] ? row[drillIdx].value : null,
            value: (typeof raw === 'number' && !isNaN(raw)) ? raw : 0,
            formatted: fmtCell(row[measIdx])
          };
        });
        // o grupo aberto sumiu dos dados (filtro mudou): volta ao 1º nível
        if (drill.group !== null && !drill.rawRows.some(function (r) { return r.label === drill.group; })) { drill.group = null; drill.groupRaw = null; }
        render();
        return;
      }
      drill.group = null; drill.groupRaw = null;
      var rows = (sumData.data || []).map(function (row) {
        var raw = row[measIdx] ? row[measIdx].value : null;
        return {
          label: row[dimIdx] ? row[dimIdx].formattedValue : '',
          dimRaw: row[dimIdx] ? row[dimIdx].value : null,
          value: (typeof raw === 'number' && !isNaN(raw)) ? raw : 0,
          formatted: fmtCell(row[measIdx])
        };
      });

      if (state.sortOrder === 'desc') rows.sort(function (a, b) { return b.value - a.value; });
      else if (state.sortOrder === 'asc') rows.sort(function (a, b) { return a.value - b.value; });

      var max = parseInt(state.maxItems, 10);
      if (!isNaN(max) && max > 0) rows = rows.slice(0, max);

      lastRows = rows;
      render();
    }).catch(function (err) {
      clearTimeout(loadTimeoutId);
      console.error('[Projedata Gráfico de Pizza] erro ao ler dados da planilha:', err);
      titleEl.textContent = 'Erro: ' + (err && (err.message || err.toString()) || 'ver console (F12)');
      bodyEl.innerHTML = '';
    });
  }

  function openConfigDialog() {
    tableau.extensions.ui.displayDialogAsync('https://renatoheinzen.github.io/tableau-skin/html/pie-chart-config.html', '', { height: 560, width: 340 })
      .then(function () { loadState(); updateChart(); })
      .catch(function (error) {
        console.log('[Projedata Gráfico de Pizza] dialog fechado:', error && error.message);
      });
  }

  if (typeof tableau === 'undefined' || !tableau.extensions) {
    titleEl.textContent = 'Falha ao carregar script da API do Tableau';
    return;
  }

  var initTimeoutId = setTimeout(function () {
    titleEl.textContent = 'Timeout: initializeAsync não respondeu em 15s';
  }, 15000);

  try {
    tableau.extensions.initializeAsync({ configure: openConfigDialog }).then(function () {
      clearTimeout(initTimeoutId);
      loadState();
      tableau.extensions.worksheetContent.worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, updateChart);
      pdInitClick();
      updateChart();
    }).catch(function (err) {
      clearTimeout(initTimeoutId);
      titleEl.textContent = 'Erro no initializeAsync: ' + (err && (err.message || err.toString()) || 'desconhecido');
    });
  } catch (syncErr) {
    clearTimeout(initTimeoutId);
    titleEl.textContent = 'Erro síncrono: ' + (syncErr && syncErr.message || syncErr);
  }
})();
</script>

<script>
// dica de ferramenta própria: converte title (HTML) e <title> (SVG) em um cartão estilizado
(function () {
  var tip = document.createElement('div');
  tip.className = 'pd-tip';
  document.body.appendChild(tip);
  function textOf(n) {
    if (n.namespaceURI === 'http://www.w3.org/2000/svg') {
      for (var i = 0; i < n.children.length; i++) {
        if (n.children[i].localName === 'title') { var t = n.children[i].textContent; n.removeChild(n.children[i]); n.setAttribute('data-tip', t); break; }
      }
    } else if (n.hasAttribute && n.hasAttribute('title')) {
      n.setAttribute('data-tip', n.getAttribute('title')); n.removeAttribute('title');
    }
    return n.getAttribute ? n.getAttribute('data-tip') : null;
  }
  function find(t) {
    for (var n = t; n && n !== document.body; n = n.parentNode) { if (n.nodeType === 1 && textOf(n)) return n; }
    return null;
  }
  function color(n) {
    if (n.namespaceURI !== 'http://www.w3.org/2000/svg') return '';
    var cs = getComputedStyle(n), c = cs.fill;
    if (!c || c === 'none' || c.indexOf('url(') === 0) c = cs.stroke;
    return c && c !== 'none' && c.indexOf('url(') !== 0 ? c : '';
  }
  function add(cls, txt) { var d = document.createElement('div'); d.className = cls; d.textContent = txt; tip.appendChild(d); }
  function show(n, e) {
    var lines = n.getAttribute('data-tip').split('\n'), head = lines[0], cat = '', val = '', m;
    if ((m = /^(.*?) · (.*): ([^:]*)$/.exec(head))) { head = m[1]; cat = m[2]; val = m[3]; }
    else if (lines.length === 1 && (m = /^(.*): ([^:]*)$/.exec(head))) { head = m[1]; val = m[2]; }
    tip.innerHTML = '';
    var h = document.createElement('div'); h.className = 'tt-h';
    var c = color(n);
    if (c) { var sw = document.createElement('i'); sw.style.background = c; h.appendChild(sw); }
    var nm = document.createElement('span'); nm.textContent = head; h.appendChild(nm); tip.appendChild(h);
    if (cat) add('tt-c', cat);
    lines.slice(1).forEach(function (l) { add('tt-c', l); });
    if (val) add('tt-v', val);
    tip.classList.add('on'); move(e);
  }
  function move(e) {
    var w = tip.offsetWidth, h = tip.offsetHeight, x = e.clientX + 14, y = e.clientY + 14;
    if (x + w > window.innerWidth - 4) x = e.clientX - w - 14;
    if (y + h > window.innerHeight - 4) y = e.clientY - h - 14;
    tip.style.left = Math.max(4, x) + 'px'; tip.style.top = Math.max(4, y) + 'px';
  }
  document.addEventListener('mouseover', function (e) { var n = find(e.target); if (n) show(n, e); else tip.classList.remove('on'); });
  document.addEventListener('mousemove', function (e) { if (tip.classList.contains('on')) { var n = find(e.target); if (n) move(e); else tip.classList.remove('on'); } });
  document.addEventListener('mouseleave', function () { tip.classList.remove('on'); });
})();
</script>
