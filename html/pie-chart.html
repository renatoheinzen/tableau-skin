<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projedata Gráfico de Pizza</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: var(--pd-font);
    overflow: hidden;
    background: transparent;
  }
  #chart-root {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: var(--pd-card-padding);
    background: var(--pd-card-bg);
    border: var(--pd-card-border-width) solid var(--pd-card-border-color);
    border-radius: var(--pd-card-radius);
    box-shadow: var(--pd-card-shadow);
  }
  #chart-title {
    font-size: var(--pd-title-size); font-weight: var(--pd-title-weight); color: var(--pd-text-muted);
    text-transform: var(--pd-title-transform); letter-spacing: var(--pd-title-spacing);
    margin-bottom: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #chart-title.hidden { display: none !important; }
  #chart-status { font-size: 13px; color: var(--pd-text-muted); padding: 8px 0; }

  #chart-body {
    flex: 1; min-height: 0;
    display: flex; align-items: center; gap: 16px;
  }
  #chart-body.legend-bottom { flex-direction: column; gap: 8px; }
  #chart-body.legend-none { justify-content: center; }
  #pie-wrap { flex: 1 1 0; min-width: 0; min-height: 0; height: 100%; display: flex; align-items: center; justify-content: center; }
  #pie-wrap svg { max-width: 100%; max-height: 100%; }
  #pie-wrap path { transition: opacity 0.15s ease; }
  #pie-wrap path:hover { opacity: 0.8; }
  .donut-total { font-family: var(--pd-font); font-weight: 700; fill: var(--pd-text); }
  .donut-caption { font-family: var(--pd-font); fill: var(--pd-text-muted); }

  #legend {
    flex: 0 1 auto; max-width: 45%; max-height: 100%;
    overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: 6px;
  }
  #chart-body.legend-bottom #legend { max-width: 100%; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 4px 12px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--pd-text); min-width: 0; }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 10px; }
  .legend-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .legend-value { color: var(--pd-text-muted); font-weight: 700; white-space: nowrap; }
</style>
</head>
<body>

<div id="chart-root">
  <div id="chart-title">Carregando...</div>
  <div id="chart-body"></div>
</div>

<script>
(function () {
  var STATE_KEY = 'projedataPieState';
  var titleEl = document.getElementById('chart-title');
  var bodyEl = document.getElementById('chart-body');
  var SERIES_COUNT = 8;

  var DISPLAY_UNITS = { K: [1e3, ' K'], M: [1e6, ' M'], B: [1e9, ' B'], T: [1e12, ' T'] };

  function formatCompact(v) {
    var dec = parseInt(state.decimals, 10);
    var hasDec = !isNaN(dec) && dec >= 0;
    var opts = hasDec ? { minimumFractionDigits: dec, maximumFractionDigits: dec } : { maximumFractionDigits: 1 };
    var fixed = DISPLAY_UNITS[state.displayUnits];
    if (fixed) return (v / fixed[0]).toLocaleString('pt-BR', opts) + fixed[1];
    var abs = Math.abs(v);
    if (abs >= 1e12) return (v / 1e12).toLocaleString('pt-BR', opts) + ' T';
    if (abs >= 1e9) return (v / 1e9).toLocaleString('pt-BR', opts) + ' B';
    if (abs >= 1e6) return (v / 1e6).toLocaleString('pt-BR', opts) + ' M';
    if (abs >= 1e3) return (v / 1e3).toLocaleString('pt-BR', opts) + ' K';
    return v.toLocaleString('pt-BR', opts);
  }

  // Valores: padrão = texto formatado pelo Tableau; com unidade/casas escolhidas, usa o formato compacto
  function fmtCell(cell) {
    if (!cell) return '';
    if ((state.displayUnits || state.decimals !== '') && typeof cell.value === 'number' && !isNaN(cell.value)) return formatCompact(cell.value);
    return cell.formattedValue;
  }

  var state = {
    displayUnits: '', decimals: '',
    customLabel: '', showLabel: true,
    dimensionField: '', measureField: '',
    donut: false, legend: 'right', showPercent: true,
    sortOrder: '', maxItems: ''
  };
  var lastRows = [];

  function loadState() {
    try {
      var saved = tableau.extensions.settings.get(STATE_KEY);
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch (e) { /* sem config salva ainda */ }
    titleEl.classList.toggle('hidden', state.showLabel === false);
  }

  function findColumnIndex(columns, fieldName, fallback) {
    if (fieldName) {
      var idx = columns.findIndex(function (c) { return c.fieldName === fieldName; });
      if (idx !== -1) return idx;
    }
    return fallback;
  }
  function defaultDimensionIndex(columns) {
    var idx = columns.findIndex(function (c) { return c.dataType === 'string'; });
    return idx !== -1 ? idx : 0;
  }
  function defaultMeasureIndex(columns, dimIdx) {
    var idx = columns.findIndex(function (c, i) {
      return i !== dimIdx && (c.dataType === 'int' || c.dataType === 'float');
    });
    if (idx !== -1) return idx;
    return dimIdx === 0 && columns.length > 1 ? 1 : 0;
  }

  function formatPct(v) { return v.toFixed(1).replace('.', ',') + '%'; }

  function polar(cx, cy, r, a) { return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; }

  function slicePath(cx, cy, rOut, rIn, a0, a1) {
    var large = (a1 - a0) > Math.PI ? 1 : 0;
    var p0 = polar(cx, cy, rOut, a0), p1 = polar(cx, cy, rOut, a1);
    if (rIn > 0) {
      var q1 = polar(cx, cy, rIn, a1), q0 = polar(cx, cy, rIn, a0);
      return 'M' + p0 + ' A' + rOut + ',' + rOut + ' 0 ' + large + ' 1 ' + p1 +
             ' L' + q1 + ' A' + rIn + ',' + rIn + ' 0 ' + large + ' 0 ' + q0 + ' Z';
    }
    return 'M' + cx + ',' + cy + ' L' + p0 + ' A' + rOut + ',' + rOut + ' 0 ' + large + ' 1 ' + p1 + ' Z';
  }

  function svgEl(name, attrs) {
    var el = document.createElementNS('http://www.w3.org/2000/svg', name);
    Object.keys(attrs || {}).forEach(function (k) { el.setAttribute(k, attrs[k]); });
    return el;
  }

  function render() {
    bodyEl.innerHTML = '';
    var rows = lastRows;
    if (rows.length === 0) {
      var empty = document.createElement('div');
      empty.id = 'chart-status';
      empty.textContent = 'Sem dados';
      bodyEl.appendChild(empty);
      return;
    }

    var legendMode = state.legend || 'right';
    bodyEl.className = 'legend-' + legendMode;

    var total = rows.reduce(function (s, r) { return s + Math.max(r.value, 0); }, 0) || 1;
    var SIZE = 200, C = SIZE / 2, R_OUT = 96, R_IN = state.donut ? 58 : 0;

    var svg = svgEl('svg', { viewBox: '0 0 ' + SIZE + ' ' + SIZE, preserveAspectRatio: 'xMidYMid meet' });
    var angle = -Math.PI / 2;
    rows.forEach(function (r, i) {
      var frac = Math.max(r.value, 0) / total;
      if (frac <= 0) return;
      var color = 'var(--pd-series-' + ((i % SERIES_COUNT) + 1) + ')';
      var path;
      if (frac >= 0.9999) {
        path = svgEl('path', {
          d: slicePath(C, C, R_OUT, R_IN, angle, angle + Math.PI) + ' ' + slicePath(C, C, R_OUT, R_IN, angle + Math.PI, angle + 2 * Math.PI),
          fill: color, 'fill-rule': 'evenodd'
        });
      } else {
        path = svgEl('path', { d: slicePath(C, C, R_OUT, R_IN, angle, angle + frac * 2 * Math.PI), fill: color });
      }
      var tip = svgEl('title');
      tip.textContent = r.label + ': ' + r.formatted + ' (' + formatPct(frac * 100) + ')';
      path.appendChild(tip);
      svg.appendChild(path);
      angle += frac * 2 * Math.PI;
    });

    if (state.donut) {
      var totalText = svgEl('text', { x: C, y: C + 2, 'text-anchor': 'middle', 'font-size': 26, class: 'donut-total' });
      totalText.textContent = formatCompact(total);
      var caption = svgEl('text', { x: C, y: C + 22, 'text-anchor': 'middle', 'font-size': 11, class: 'donut-caption' });
      caption.textContent = 'Total';
      svg.appendChild(totalText);
      svg.appendChild(caption);
    }

    var wrap = document.createElement('div');
    wrap.id = 'pie-wrap';
    wrap.appendChild(svg);
    bodyEl.appendChild(wrap);

    if (legendMode !== 'none') {
      var legend = document.createElement('div');
      legend.id = 'legend';
      rows.forEach(function (r, i) {
        var item = document.createElement('div');
        item.className = 'legend-item';
        var dot = document.createElement('span');
        dot.className = 'legend-dot';
        dot.style.background = 'var(--pd-series-' + ((i % SERIES_COUNT) + 1) + ')';
        var label = document.createElement('span');
        label.className = 'legend-label';
        label.textContent = r.label;
        label.title = r.label;
        item.appendChild(dot);
        item.appendChild(label);
        if (state.showPercent !== false) {
          var pct = document.createElement('span');
          pct.className = 'legend-value';
          pct.textContent = formatPct(Math.max(r.value, 0) / total * 100);
          item.appendChild(pct);
        }
        legend.appendChild(item);
      });
      bodyEl.appendChild(legend);
    }
  }

  var loadTimeoutId = null;
  function updateChart() {
    titleEl.textContent = 'Carregando...';
    if (loadTimeoutId) clearTimeout(loadTimeoutId);
    loadTimeoutId = setTimeout(function () {
      titleEl.textContent = 'Tempo excedido — abra o console (F12)';
      bodyEl.innerHTML = '';
    }, 8000);

    var worksheet = tableau.extensions.worksheetContent.worksheet;
    worksheet.getSummaryDataAsync({ ignoreSelection: true }).then(function (sumData) {
      clearTimeout(loadTimeoutId);
      if (!sumData || !sumData.columns || sumData.columns.length === 0) {
        titleEl.textContent = 'Arraste campos para as Marcas';
        bodyEl.innerHTML = '';
        return;
      }

      var dimIdx = findColumnIndex(sumData.columns, state.dimensionField, defaultDimensionIndex(sumData.columns));
      var measIdx = findColumnIndex(sumData.columns, state.measureField, defaultMeasureIndex(sumData.columns, dimIdx));

      titleEl.textContent = (state.customLabel && state.customLabel.trim() !== '')
        ? state.customLabel
        : sumData.columns[measIdx].fieldName;
      titleEl.classList.toggle('hidden', state.showLabel === false);

      var rows = (sumData.data || []).map(function (row) {
        var raw = row[measIdx] ? row[measIdx].value : null;
        return {
          label: row[dimIdx] ? row[dimIdx].formattedValue : '',
          value: (typeof raw === 'number' && !isNaN(raw)) ? raw : 0,
          formatted: fmtCell(row[measIdx])
        };
      });

      if (state.sortOrder === 'desc') rows.sort(function (a, b) { return b.value - a.value; });
      else if (state.sortOrder === 'asc') rows.sort(function (a, b) { return a.value - b.value; });

      var max = parseInt(state.maxItems, 10);
      if (!isNaN(max) && max > 0) rows = rows.slice(0, max);

      lastRows = rows;
      render();
    }).catch(function (err) {
      clearTimeout(loadTimeoutId);
      console.error('[Projedata Gráfico de Pizza] erro ao ler dados da planilha:', err);
      titleEl.textContent = 'Erro: ' + (err && (err.message || err.toString()) || 'ver console (F12)');
      bodyEl.innerHTML = '';
    });
  }

  function openConfigDialog() {
    tableau.extensions.ui.displayDialogAsync('https://renatoheinzen.github.io/tableau-skin/html/pie-chart-config.html', '', { height: 560, width: 340 })
      .then(function () { loadState(); updateChart(); })
      .catch(function (error) {
        console.log('[Projedata Gráfico de Pizza] dialog fechado:', error && error.message);
      });
  }

  if (typeof tableau === 'undefined' || !tableau.extensions) {
    titleEl.textContent = 'Falha ao carregar script da API do Tableau';
    return;
  }

  var initTimeoutId = setTimeout(function () {
    titleEl.textContent = 'Timeout: initializeAsync não respondeu em 15s';
  }, 15000);

  try {
    tableau.extensions.initializeAsync({ configure: openConfigDialog }).then(function () {
      clearTimeout(initTimeoutId);
      loadState();
      tableau.extensions.worksheetContent.worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, updateChart);
      updateChart();
    }).catch(function (err) {
      clearTimeout(initTimeoutId);
      titleEl.textContent = 'Erro no initializeAsync: ' + (err && (err.message || err.toString()) || 'desconhecido');
    });
  } catch (syncErr) {
    clearTimeout(initTimeoutId);
    titleEl.textContent = 'Erro síncrono: ' + (syncErr && syncErr.message || syncErr);
  }
})();
</script>

</body>
</html>
