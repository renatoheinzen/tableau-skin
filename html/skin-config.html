<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Format Extension — Projedata Skin</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: 'Montserrat', Arial, sans-serif;
    color: var(--preto);
    background: var(--branco);
  }
  body { padding: 16px; }
  h2 { margin: 0 0 4px 0; font-size: 15px; color: var(--azul-escuro); }
  .subtitle { font-size: 11px; color: #888; margin-bottom: 16px; }

  label.field { display: block; margin-top: 12px; font-weight: 600; font-size: 12px; color: var(--azul-escuro); }
  .hint { color: #999; font-size: 10px; margin-top: 6px; line-height: 1.4; }

  .theme-row { display: flex; gap: 10px; margin: 8px 0 4px 0; }
  .theme-swatch {
    flex: 1; padding: 10px; border-radius: 6px; text-align: center;
    cursor: pointer; border: 2px solid transparent; font-size: 12px; font-weight: 700;
  }
  .theme-swatch.claro { background: #EBF0F5; color: var(--azul-escuro); }
  .theme-swatch.escuro { background: #0C0F3D; color: var(--branco); }
  .theme-swatch.selected { border-color: var(--azul); }

  .actions {
    display: flex; gap: 8px; margin-top: 20px;
  }
  button {
    flex: 1; padding: 9px; border: none; border-radius: 4px;
    font-weight: 700; font-size: 13px; cursor: pointer;
  }
  #save-btn { background: var(--azul); color: var(--branco); }
  #save-btn:hover { background: var(--azul-escuro); }
  #cancel-btn { background: var(--cinza); color: var(--preto); }
  #cancel-btn:hover { background: #e2e2e2; }
</style>
</head>
<body>

<h2>Projedata Skin</h2>
<div class="subtitle">Formatar extensão</div>

<label class="field">Tema padrão</label>
<div class="theme-row" id="theme-row">
  <div class="theme-swatch claro selected" data-theme="claro">Claro</div>
  <div class="theme-swatch escuro" data-theme="escuro">Escuro</div>
</div>
<div class="hint">
  Usado quando o workbook não tem um parâmetro chamado "Projedata Tema". Se esse
  parâmetro existir (valores "Claro"/"Escuro"), ele manda no tema — inclusive em tempo
  real, via ação de parâmetro — e esta escolha vira só o valor inicial.
</div>

<div class="actions">
  <button id="cancel-btn">Cancelar</button>
  <button id="save-btn">Salvar</button>
</div>

<script>
(function () {
  var themeRow = document.getElementById('theme-row');
  var saveBtn = document.getElementById('save-btn');
  var cancelBtn = document.getElementById('cancel-btn');
  var state = { theme: 'claro' };

  function selectTheme(theme) {
    state.theme = theme;
    document.querySelectorAll('.theme-swatch').forEach(function (el) {
      el.classList.toggle('selected', el.dataset.theme === theme);
    });
  }

  themeRow.addEventListener('click', function (e) {
    var swatch = e.target.closest('.theme-swatch');
    if (swatch) selectTheme(swatch.dataset.theme);
  });

  function closeWithoutSaving() {
    tableau.extensions.ui.closeDialog('cancelled');
  }
  cancelBtn.addEventListener('click', closeWithoutSaving);

  function save() {
    tableau.extensions.settings.set('projedataSkinTheme', state.theme);
    tableau.extensions.settings.saveAsync().then(function () {
      tableau.extensions.ui.closeDialog('saved');
    }).catch(function (err) {
      console.error('[Projedata Skin config] erro ao salvar:', err);
      alert('Erro ao salvar configurações. Veja o console (F12).');
    });
  }
  saveBtn.addEventListener('click', save);

  tableau.extensions.initializeDialogAsync().then(function () {
    try {
      var saved = tableau.extensions.settings.get('projedataSkinTheme');
      if (saved === 'escuro' || saved === 'claro') state.theme = saved;
    } catch (e) { /* sem config salva ainda */ }
    selectTheme(state.theme);
  });
})();
</script>

</body>
</html>
