<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Projedata Tabela</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link rel="stylesheet" href="../assets/tokens.css">
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    font-family: var(--pd-font);
    overflow: hidden;
    background: transparent;
  }
  #chart-root {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: var(--pd-card-padding);
    background: var(--pd-card-bg);
    border: var(--pd-card-border-width) solid var(--pd-card-border-color);
    border-radius: var(--pd-card-radius);
    box-shadow: var(--pd-card-shadow);
    --row-pad: 7px; --font: 12px;
  }
  #chart-root.density-compact { --row-pad: 4px; --font: 11px; }
  #chart-root.density-comfortable { --row-pad: 11px; --font: 13px; }
  #chart-title {
    font-size: var(--pd-title-size); font-weight: var(--pd-title-weight); color: var(--pd-text-muted);
    text-transform: var(--pd-title-transform); letter-spacing: var(--pd-title-spacing);
    margin-bottom: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #chart-title.hidden { display: none !important; }
  #chart-status { font-size: 13px; color: var(--pd-text-muted); padding: 8px 0; }

  #chart-body { flex: 1; min-height: 0; overflow: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: var(--font); color: var(--pd-text); }
  th, td { padding: var(--row-pad) 10px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
  #chart-root.wrap td { white-space: normal; }
  th.num, td.num { text-align: right; }
  th.al-center, td.al-center { text-align: center; }
  th.al-right, td.al-right { text-align: right; }
  th.al-left, td.al-left { text-align: left; }

  th {
    position: sticky; top: 0; z-index: 1;
    font-size: 10px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    cursor: pointer; user-select: none;
    background: var(--pd-card-bg); color: var(--pd-text-muted);
    border-bottom: 2px solid var(--pd-track);
  }
  th .arrow { margin-left: 4px; opacity: 0.9; }
  #chart-root.head-filled th { background: var(--pd-accent-1); color: #fff; border-bottom: 0; }
  #chart-root.head-filled.accent-laranja th { background: var(--pd-accent-2); }
  #chart-root.head-filled.accent-amarelo th { background: var(--pd-accent-3); color: #161616; }
  #chart-root.head-filled.accent-azul-escuro th { background: var(--pd-accent-4); color: #161616; }
  #chart-root.head-soft th { background: var(--pd-track); color: var(--pd-text); border-bottom: 0; }
  #chart-root.head-filled th:first-child, #chart-root.head-soft th:first-child { border-top-left-radius: 6px; }
  #chart-root.head-filled th:last-child, #chart-root.head-soft th:last-child { border-top-right-radius: 6px; }

  td { border-bottom: 1px solid transparent; position: relative; }
  #chart-root.grid td { border-bottom-color: var(--pd-track); }
  #chart-root.zebra tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--pd-track) 45%, transparent); }
  td.rownum { color: var(--pd-text-muted); width: 1%; }
  td .t-bar {
    position: absolute; left: 0; top: 18%; bottom: 18%; border-radius: 0 3px 3px 0;
    background: var(--pd-accent-1); opacity: 0.22; pointer-events: none;
  }
  #chart-root.accent-laranja td .t-bar { background: var(--pd-accent-2); }
  #chart-root.accent-amarelo td .t-bar { background: var(--pd-accent-3); }
  #chart-root.accent-azul-escuro td .t-bar { background: var(--pd-accent-4); }
  td .t-txt { position: relative; }
  /* barra sólida + valor ao lado */
  td .t-ib { display: flex; align-items: center; gap: 8px; min-width: 0; }
  td .t-ib .t-hbar { flex: 0 0 auto; height: 8px; border-radius: 2px; background: var(--pd-accent-1); }
  td.al-right .t-ib, td.num .t-ib { justify-content: flex-start; }
  td.al-center .t-ib { justify-content: center; }
  #chart-root.accent-laranja td .t-hbar { background: var(--pd-accent-2); }
  #chart-root.accent-amarelo td .t-hbar { background: var(--pd-accent-3); }
  #chart-root.accent-azul-escuro td .t-hbar { background: var(--pd-accent-4); }
  /* selo: cor por valor (A/B/C usam as cores de destaque; outros valores, a paleta de séries) */
  td .t-badge {
    display: inline-block; min-width: 18px; padding: 1px 8px; box-sizing: border-box;
    border-radius: 999px; font-size: 0.85em; font-weight: 700; line-height: 1.5; text-align: center;
    color: var(--b); background: color-mix(in srgb, var(--b) 22%, transparent);
  }
  td.pos .t-txt { color: var(--pd-positive); font-weight: 700; }
  td.neg .t-txt { color: var(--pd-negative); font-weight: 700; }
  tfoot td { position: sticky; bottom: 0; font-weight: 700; background: var(--pd-card-bg); border-top: 2px solid var(--pd-track); border-bottom: 0; }
  /* clique filtra o dashboard (seleção de marcas) */
  .pd-click { cursor: pointer; }
  tbody tr.pd-sel { background: color-mix(in srgb, var(--pd-accent-1) 12%, transparent); }
  .pd-dim { opacity: 0.35; }
  /* hierarquia expansível (drill-down) */
  td.tree-lbl { text-align: left; }
  td.tree-lbl .t-tree { display: inline-flex; align-items: center; max-width: 100%; }
  .t-caret {
    flex: 0 0 auto; display: inline-block; width: 18px; text-align: center; cursor: pointer; user-select: none;
    color: var(--pd-text-muted); font-size: 0.9em; transition: transform 0.12s;
  }
  .t-caret:hover { color: var(--pd-text); }
  .t-caret.open { transform: rotate(90deg); }
  .t-caret.leaf { visibility: hidden; cursor: default; }
  tr.lvl-parent td { font-weight: 700; }
  th .t-expall {
    display: inline-block; width: 16px; height: 16px; line-height: 14px; margin-right: 6px; text-align: center;
    border: 1px solid currentColor; border-radius: 3px; font-size: 12px; font-weight: 700; opacity: 0.8; vertical-align: middle;
  }
  th .t-expall:hover { opacity: 1; }
</style>
</head>
<body>

<div id="chart-root" class="zebra grid">
  <div id="chart-title">Carregando...</div>
  <div id="chart-body"><table id="tbl"></table></div>
</div>

<script>
(function () {
  var STATE_KEY = 'projedataTableState';
  var root = document.getElementById('chart-root');
  var titleEl = document.getElementById('chart-title');
  var tbl = document.getElementById('tbl');
  var bodyEl = document.getElementById('chart-body');
  var ACCENT_CLASSES = ['accent-laranja', 'accent-amarelo', 'accent-azul-escuro'];

  var DISPLAY_UNITS = { K: [1e3, ' K'], M: [1e6, ' M'], B: [1e9, ' B'], T: [1e12, ' T'] };

  function formatCompact(v) {
    var dec = parseInt(state.decimals, 10);
    var hasDec = !isNaN(dec) && dec >= 0;
    var opts = hasDec ? { minimumFractionDigits: dec, maximumFractionDigits: dec } : { maximumFractionDigits: 1 };
    var fixed = DISPLAY_UNITS[state.displayUnits];
    if (fixed) return (v / fixed[0]).toLocaleString('pt-BR', opts) + fixed[1];
    var abs = Math.abs(v);
    if (abs >= 1e12) return (v / 1e12).toLocaleString('pt-BR', opts) + ' T';
    if (abs >= 1e9) return (v / 1e9).toLocaleString('pt-BR', opts) + ' B';
    if (abs >= 1e6) return (v / 1e6).toLocaleString('pt-BR', opts) + ' M';
    if (abs >= 1e3) return (v / 1e3).toLocaleString('pt-BR', opts) + ' K';
    return v.toLocaleString('pt-BR', opts);
  }

  var state = {
    accent: '', displayUnits: '', decimals: '',
    customLabel: '', showLabel: true,
    columnsSpec: '', headerStyle: 'plain', zebra: true, showGrid: true, density: 'normal',
    rowNumbers: false, showTotals: false, totalLabel: 'Total', wrapText: false,
    sortField: '', sortOrder: 'desc', maxRows: '',
    hierarchy: false, hierarchyFields: '', hierarchyTitle: '', expandLevels: '0'
  };
  var expanded = {};         // chaves dos nós abertos (hierarquia); não é salvo nas configurações
  var expandedInit = false;
  var model = null;          // { cols: [{ title, num, align, format, visual, min, max }], rows: [[{ v, text }]] }
  var userSort = null;       // { idx, dir } definido pelo clique no cabeçalho

  var ALIGN = { esq: 'left', esquerda: 'left', left: 'left', centro: 'center', center: 'center', dir: 'right', direita: 'right', right: 'right' };
  var FORMAT = { auto: 1, compact: 1, int: 1, dec1: 1, dec2: 1, pct: 1 };
  var VISUAL = { bar: 1, heat: 1, sign: 1, hbar: 1, badge: 1 };
  // selo: A/B/C (curva ABC) com cores fixas; demais valores recebem a paleta de séries na ordem em que aparecem
  var BADGE_FIXED = { A: 'var(--pd-accent-1)', B: 'var(--pd-accent-3)', C: 'var(--pd-accent-2)' };
  function badgeColor(col, text) {
    var k = String(text).trim();
    if (BADGE_FIXED[k.toUpperCase()] && col.badgeAbc) return BADGE_FIXED[k.toUpperCase()];
    return 'var(--pd-series-' + ((col.badgeOrder[k] % 8) + 1) + ')';
  }

  function loadState() {
    try {
      var saved = tableau.extensions.settings.get(STATE_KEY);
      if (saved) state = Object.assign(state, JSON.parse(saved));
    } catch (e) { /* sem config salva ainda */ }
    ACCENT_CLASSES.forEach(function (c) { root.classList.remove(c); });
    // accent pode ser uma classe do tema ou uma cor personalizada (#RRGGBB)
    var customAccent = state.accent && state.accent.charAt(0) === '#';
    if (state.accent && !customAccent) root.classList.add(state.accent);
    if (customAccent) root.style.setProperty('--pd-accent-1', state.accent);
    else root.style.removeProperty('--pd-accent-1');
    root.classList.toggle('zebra', state.zebra !== false);
    root.classList.toggle('grid', state.showGrid !== false);
    root.classList.toggle('wrap', !!state.wrapText);
    ['plain', 'filled', 'soft'].forEach(function (h) { root.classList.toggle('head-' + h, state.headerStyle === h); });
    ['compact', 'comfortable'].forEach(function (d) { root.classList.toggle('density-' + d, state.density === d); });
    titleEl.classList.toggle('hidden', state.showLabel === false);
  }

  // Aceita rgb(), rgba() e color(srgb r g b) (formatos que o navegador devolve para color-mix)
  function luminanceOf(cssColor) {
    var m = /rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/.exec(cssColor);
    var r, g, b;
    if (m) { r = +m[1] / 255; g = +m[2] / 255; b = +m[3] / 255; }
    else {
      m = /color\(srgb\s+([\d.]+)\s+([\d.]+)\s+([\d.]+)/.exec(cssColor);
      if (!m) return null;
      r = +m[1]; g = +m[2]; b = +m[3];
    }
    return 0.299 * r + 0.587 * g + 0.114 * b;
  }

  // "Campo | Título | direita | pct | bar" — alinhamento, formato e visual em qualquer ordem
  function parseSpec(text) {
    var out = [];
    String(text || '').split('\n').forEach(function (line) {
      if (!line.trim()) return;
      var p = line.split('|').map(function (s) { return s.trim(); });
      var d = { field: p[0], title: p[1] || '', align: '', format: 'auto', visual: '' };
      p.slice(2).forEach(function (t) {
        var k = t.toLowerCase();
        if (ALIGN[k]) d.align = ALIGN[k];
        else if (FORMAT[k]) d.format = k;
        else if (VISUAL[k]) d.visual = k;
      });
      out.push(d);
    });
    return out;
  }

  function fmtValue(col, cell) {
    if (!cell) return '';
    var v = cell.value;
    var isNum = typeof v === 'number' && !isNaN(v);
    if (isNum) {
      if (col.format === 'int') return Math.round(v).toLocaleString('pt-BR');
      if (col.format === 'dec1') return v.toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
      if (col.format === 'dec2') return v.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (col.format === 'pct') return (v * 100).toLocaleString('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + '%';
      if (col.format === 'compact' || state.displayUnits || state.decimals !== '') return formatCompact(v);
    }
    return cell.formattedValue;
  }

  function sortedRows(list) {
    var rows = (list || model.rows).slice();
    var s = userSort || (model.defaultSort ? model.defaultSort : null);
    if (!s) return rows;
    var cmp = function (a, b) {
      var x = a[s.idx], y = b[s.idx];
      var r;
      if (model.cols[s.idx].num) r = x.v - y.v;
      else if (!isNaN(x.k) && !isNaN(y.k)) r = x.k - y.k;
      else r = String(x.text).localeCompare(String(y.text), 'pt-BR', { numeric: true });
      return s.dir === 'asc' ? r : -r;
    };
    rows.sort(cmp);
    return rows;
  }

  // soma de uma coluna numérica nas linhas-pai: usa prefixo/sufixo/casas decimais de uma amostra já formatada pelo Tableau
  function sumText(col, total) {
    var m = /^([^\d\-+]*)(-?[\d.,]*\d)(.*)$/.exec(col.sample || '');
    if (!m) return total.toLocaleString('pt-BR', { maximumFractionDigits: 2 });
    var di = m[2].lastIndexOf(',');
    var dec = di === -1 ? 0 : m[2].length - di - 1;
    return m[1] + total.toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + m[3];
  }

  // campos de cada nível: os informados em "Níveis" ou, se vazio, as dimensões da planilha na ordem em que chegam
  function resolveLevels(cols, isNumCol) {
    var idxs = [];
    String(state.hierarchyFields || '').split(/[\n,>]+/).forEach(function (nm) {
      nm = nm.trim().toLowerCase();
      if (!nm) return;
      var i = cols.findIndex(function (c) { return c.fieldName.toLowerCase() === nm; });
      if (i !== -1 && idxs.indexOf(i) === -1) idxs.push(i);
    });
    if (!idxs.length) cols.forEach(function (c, i) { if (!isNumCol(i)) idxs.push(i); });
    return idxs;
  }

  // agrupa as linhas por caminho (nível 1 › nível 2 › …); cada nó é um array de células, como uma linha normal
  function buildTree(levelIdxs, mcols, rows, data, cols) {
    var L = levelIdxs.length, top = [], byKey = {}, all = [];
    rows.forEach(function (r, i) {
      var parent = null, path = '';
      for (var d = 0; d < L; d++) {
        var c = data[i][levelIdxs[d]];
        var label = c ? String(c.formattedValue) : '';
        path += (d ? '\u0001' : '') + label;
        var n = byKey[path];
        if (!n) {
          n = byKey[path] = [];
          n.depth = d; n.key = path; n.label = label; n.kids = []; n.leaves = [];
          n.sel = pdSel(cols, data[i], levelIdxs.slice(0, d + 1));
          (parent ? parent.kids : top).push(n);
          all.push(n);
        }
        n.leaves.push(r);
        parent = n;
      }
    });
    all.forEach(function (n) {
      var isLeaf = n.kids.length === 0;
      n.push({ v: 0, k: NaN, text: n.label });
      mcols.forEach(function (c, j) {
        if (n.leaves.length === 1 && (c.num || isLeaf)) { n.push(n.leaves[0][j]); return; }
        if (c.num && c.format !== 'pct') {
          var total = n.leaves.reduce(function (s, r) { return s + r[j].v; }, 0);
          n.push({ v: total, k: NaN, text: fmtValue(c, { value: total, formattedValue: sumText(c, total) }) });
        } else if (!c.num && isLeaf) n.push(n.leaves[0][j]);
        else n.push({ v: 0, k: NaN, text: '', blank: true });
      });
    });
    return { top: top, all: all };
  }

  function applyExpandDefault() {
    expanded = {};
    var lv = state.expandLevels === 'all' ? 99 : (parseInt(state.expandLevels, 10) || 0);
    model.treeAll.forEach(function (n) { if (n.kids.length && n.depth < lv) expanded[n.key] = true; });
  }

  function visibleTreeRows() {
    var tops = sortedRows(model.treeTop);
    var maxRows = parseInt(state.maxRows, 10);
    if (maxRows > 0) tops = tops.slice(0, maxRows);
    var out = [];
    (function walk(list) {
      list.forEach(function (n) {
        out.push(n);
        if (n.kids.length && expanded[n.key]) walk(sortedRows(n.kids));
      });
    })(tops);
    return { rows: out, tops: tops };
  }

  function render() {
    var keepScroll = bodyEl.scrollTop;
    renderTable();
    bodyEl.scrollTop = keepScroll;
  }

  function renderTable() {
    tbl.innerHTML = '';
    if (!model || model.cols.length === 0) {
      tbl.innerHTML = '<tr><td id="chart-status">Sem dados</td></tr>';
      return;
    }
    var rows, totalRows;
    if (model.tree) {
      var vt = visibleTreeRows();
      rows = vt.rows; totalRows = vt.tops;
    } else {
      rows = sortedRows();
      var maxRows = parseInt(state.maxRows, 10);
      if (maxRows > 0) rows = rows.slice(0, maxRows);
      totalRows = rows;
    }
    var cur = userSort || model.defaultSort;

    var thead = document.createElement('thead');
    var htr = document.createElement('tr');
    if (state.rowNumbers) htr.appendChild(document.createElement('th')).className = 'num';
    model.cols.forEach(function (c, i) {
      var th = document.createElement('th');
      th.className = c.align ? 'al-' + c.align : (c.num ? 'num' : '');
      th.textContent = c.title;
      th.title = c.title;
      if (model.tree && i === 0) {
        var anyOpen = Object.keys(expanded).some(function (k) { return expanded[k]; });
        var ea = document.createElement('span');
        ea.className = 't-expall';
        ea.textContent = anyOpen ? '\u2212' : '+';
        ea.title = anyOpen ? 'Recolher tudo' : 'Expandir tudo';
        ea.addEventListener('click', function (ev) {
          ev.stopPropagation();
          if (anyOpen) expanded = {};
          else model.treeAll.forEach(function (n) { if (n.kids.length) expanded[n.key] = true; });
          render();
        });
        th.insertBefore(ea, th.firstChild);
      }
      if (cur && cur.idx === i) {
        var a = document.createElement('span');
        a.className = 'arrow';
        a.textContent = cur.dir === 'asc' ? '▲' : '▼';
        th.appendChild(a);
      }
      th.addEventListener('click', function () {
        // alterna: decrescente (numéricos) / crescente (texto) → o inverso → ordem original
        var first = c.num ? 'desc' : 'asc';
        if (!userSort || userSort.idx !== i) userSort = { idx: i, dir: first };
        else if (userSort.dir === first) userSort = { idx: i, dir: first === 'desc' ? 'asc' : 'desc' };
        else userSort = null;
        render();
      });
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    tbl.appendChild(thead);

    var heatCells = [];
    var tbody = document.createElement('tbody');
    rows.forEach(function (r, ri) {
      var tr = document.createElement('tr');
      var depth = model.tree ? r.depth : 0;
      if (model.tree && r.kids.length) tr.className = 'lvl-parent';
      if (state.rowNumbers) {
        var n = document.createElement('td');
        n.className = 'rownum num';
        n.textContent = String(ri + 1);
        tr.appendChild(n);
      }
      r.forEach(function (cell, ci) {
        var c = model.cols[ci];
        var td = document.createElement('td');
        var cls = c.align ? 'al-' + c.align : (c.num ? 'num' : '');
        if (c.visual === 'sign' && c.num) cls += cell.v > 0 ? ' pos' : (cell.v < 0 ? ' neg' : '');
        td.className = cls;
        td.title = cell.text;
        if (model.tree && ci === 0) {
          td.className = 'tree-lbl';
          var wrap = document.createElement('span');
          wrap.className = 't-tree';
          wrap.style.paddingLeft = (r.depth * 18) + 'px';
          var caret = document.createElement('span');
          var hasKids = r.kids.length > 0;
          caret.className = 't-caret' + (hasKids ? (expanded[r.key] ? ' open' : '') : ' leaf');
          caret.textContent = '\u25B8';
          if (hasKids) {
            caret.addEventListener('click', function (ev) {
              ev.stopPropagation();
              expanded[r.key] = !expanded[r.key];
              render();
            });
          }
          var lt = document.createElement('span');
          lt.className = 't-txt';
          lt.textContent = cell.text;
          wrap.appendChild(caret);
          wrap.appendChild(lt);
          td.appendChild(wrap);
          tr.appendChild(td);
          return;
        }
        if (cell.blank) { tr.appendChild(td); return; }
        var st = c.stats[Math.min(depth, c.stats.length - 1)] || { min: 0, max: 0 };
        if (c.visual === 'badge' && cell.text !== '') {
          var bd = document.createElement('span');
          bd.className = 't-badge';
          bd.style.setProperty('--b', badgeColor(c, cell.text));
          bd.textContent = cell.text;
          td.appendChild(bd);
          tr.appendChild(td);
          return;
        }
        if (c.visual === 'hbar' && c.num) {
          var ib = document.createElement('span');
          ib.className = 't-ib';
          var hb = document.createElement('span');
          hb.className = 't-hbar';
          // largura proporcional ao maior valor da coluna (até 72px), o valor vem logo depois
          hb.style.width = (st.max > 0 ? Math.max(0, Math.min(1, cell.v / st.max)) * 72 : 0).toFixed(1) + 'px';
          var ht = document.createElement('span');
          ht.className = 't-txt';
          ht.textContent = cell.text;
          ib.appendChild(hb);
          ib.appendChild(ht);
          td.appendChild(ib);
          tr.appendChild(td);
          return;
        }
        if (c.visual === 'bar' && c.num) {
          var bar = document.createElement('span');
          bar.className = 't-bar';
          bar.style.width = (st.max > 0 ? Math.max(0, Math.min(100, cell.v / st.max * 100)) : 0).toFixed(1) + '%';
          td.appendChild(bar);
        }
        var txt = document.createElement('span');
        txt.className = 't-txt';
        txt.textContent = cell.text;
        td.appendChild(txt);
        if (c.visual === 'heat' && c.num) {
          var t = st.max === st.min ? 1 : (cell.v - st.min) / (st.max - st.min);
          td.style.background = 'color-mix(in srgb, var(--pd-accent-1) ' + Math.round(12 + 88 * t) + '%, var(--pd-track))';
          heatCells.push(td);
        }
        tr.appendChild(td);
      });
      pdBindClick(tr, r.sel);
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);

    if (state.showTotals) {
      var tf = document.createElement('tfoot');
      var ftr = document.createElement('tr');
      if (state.rowNumbers) ftr.appendChild(document.createElement('td'));
      model.cols.forEach(function (c, i) {
        var td = document.createElement('td');
        td.className = c.align ? 'al-' + c.align : (c.num ? 'num' : '');
        if (i === 0) td.textContent = state.totalLabel || 'Total';
        else if (c.num && c.format !== 'pct' && c.visual !== 'sign') {
          var total = totalRows.reduce(function (s, r) { return s + r[i].v; }, 0);
          td.textContent = fmtValue(c, { value: total, formattedValue: formatCompact(total) });
        }
        ftr.appendChild(td);
      });
      tf.appendChild(ftr);
      tbl.appendChild(tf);
    }

    // texto claro/escuro conforme a cor final da célula de mapa de calor
    heatCells.forEach(function (td) {
      var lum = luminanceOf(getComputedStyle(td).backgroundColor);
      td.style.color = lum != null && lum < 0.55 ? '#ffffff' : '#161616';
    });
    pdApplySelection();
  }

  var loadTimeoutId = null;
  /* ===== Clique seleciona a marca (filtra o dashboard) ===== */
  var clickDim = { field: '' };
  var clickSets = {}, selectedKeys = null, selCount = {}, selLoaded = false;
  function pdWs() { return tableau.extensions.worksheetContent.worksheet; }
  function pdNames(pairs) { return pairs.map(function (p) { return p.fieldName; }).join('\u0002'); }
  function pdKeyOf(pairs) { return pdNames(pairs) + '\u0003' + pairs.map(function (p) { return String(p.value); }).join('\u0001'); }
  // pares {fieldName, value} das colunas idxs de uma linha (ignora campos sem valor)
  function pdSel(cols, row, idxs) {
    var out = [];
    idxs.forEach(function (i) {
      if (i >= 0 && row[i] && row[i].value !== null && row[i].value !== undefined) out.push({ fieldName: cols[i].fieldName, value: row[i].value });
    });
    return out;
  }
  // target: valor da dimensão (usa clickDim.field) ou lista de pares {fieldName, value}
  function pdBindClick(el, target) {
    if (state.clickFilter === false || target === null || target === undefined) return;
    var pairs = Array.isArray(target) ? target : [{ fieldName: clickDim.field, value: target }];
    if (!pairs.length || !pairs[0].fieldName) return;
    var key = pdKeyOf(pairs), names = pdNames(pairs);
    clickSets[names] = pairs.map(function (p) { return p.fieldName; });
    el.setAttribute('data-pd-key', key);
    el.classList.add('pd-click');
    el.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var T = tableau.SelectionUpdateType, ws = pdWs();
      var multi = ev.ctrlKey || ev.metaKey || ev.shiftKey;
      var already = !!(selectedKeys && selectedKeys[key]);
      var p;
      if (multi) p = ws.selectMarksByValueAsync(pairs, already ? T.Remove : T.Add);
      else if (already && selCount[names] === 1) p = ws.clearSelectedMarksAsync();
      else p = ws.selectMarksByValueAsync(pairs, T.Replace);
      p.catch(function (e) { console.warn('[Projedata] seleção de marcas falhou:', e && (e.message || e)); });
    });
  }
  function pdApplySelection() {
    var els = document.querySelectorAll('[data-pd-key]');
    for (var i = 0; i < els.length; i++) {
      var on = !!selectedKeys && !!selectedKeys[els[i].getAttribute('data-pd-key')];
      els[i].classList.toggle('pd-dim', !!selectedKeys && !on);
      els[i].classList.toggle('pd-sel', on);
    }
    if (!selLoaded && Object.keys(clickSets).length) { selLoaded = true; pdRefreshSelection(); }
  }
  function pdRefreshSelection() {
    if (state.clickFilter === false || !Object.keys(clickSets).length) return;
    pdWs().getSelectedMarksAsync().then(function (m) {
      var keys = null, counts = {}, t = m && m.data && m.data[0];
      if (t && t.data.length) {
        keys = {};
        Object.keys(clickSets).forEach(function (names) {
          var fields = clickSets[names];
          var ci = fields.map(function (f) { var k = -1; t.columns.forEach(function (c, i) { if (c.fieldName === f) k = i; }); return k; });
          if (!ci.every(function (k) { return k !== -1; })) return;
          t.data.forEach(function (r) {
            var key = names + '\u0003' + ci.map(function (k) { return String(r[k].value); }).join('\u0001');
            if (!keys[key]) { keys[key] = true; counts[names] = (counts[names] || 0) + 1; }
          });
        });
      }
      if (keys && !Object.keys(keys).length) keys = null; // seleção que não casa com as marcas desenhadas: não esmaece
      selectedKeys = keys;
      selCount = counts;
      pdApplySelection();
    }).catch(function () {});
  }
  function pdInitClick() {
    pdWs().addEventListener(tableau.TableauEventType.MarkSelectionChanged, pdRefreshSelection);
    // clique fora das marcas limpa a seleção
    document.addEventListener('click', function () {
      if (state.clickFilter !== false && selectedKeys) pdWs().clearSelectedMarksAsync().catch(function () {});
    });
    pdRefreshSelection();
  }

  function updateChart() {
    titleEl.textContent = 'Carregando...';
    if (loadTimeoutId) clearTimeout(loadTimeoutId);
    loadTimeoutId = setTimeout(function () {
      titleEl.textContent = 'Tempo excedido — abra o console (F12)';
      tbl.innerHTML = '';
    }, 8000);

    var worksheet = tableau.extensions.worksheetContent.worksheet;
    worksheet.getSummaryDataAsync({ ignoreSelection: true }).then(function (sumData) {
      clearTimeout(loadTimeoutId);
      if (!sumData || !sumData.columns || sumData.columns.length === 0) {
        titleEl.textContent = 'Arraste os campos da tabela para as Marcas';
        tbl.innerHTML = '';
        return;
      }
      var cols = sumData.columns;
      var isNumCol = function (i) { return cols[i].dataType === 'int' || cols[i].dataType === 'float'; };

      // colunas: as da especificação (nessa ordem) ou todas as da planilha
      var defs = parseSpec(state.columnsSpec).map(function (d) {
        var idx = cols.findIndex(function (c) { return c.fieldName.toLowerCase() === d.field.toLowerCase(); });
        return idx === -1 ? null : { idx: idx, title: d.title || cols[idx].fieldName, align: d.align, format: d.format, visual: d.visual };
      }).filter(Boolean);
      if (defs.length === 0) {
        defs = cols.map(function (c, i) { return { idx: i, title: c.fieldName, align: '', format: 'auto', visual: '' }; });
      }
      // hierarquia: as dimensões dos níveis viram a 1ª coluna (com seta); as demais colunas ficam como estão
      var levelIdxs = state.hierarchy ? resolveLevels(cols, isNumCol) : [];
      var tree = levelIdxs.length >= 2;
      if (tree) {
        var restDefs = defs.filter(function (d) { return levelIdxs.indexOf(d.idx) === -1; });
        defs = restDefs.length ? restDefs : (parseSpec(state.columnsSpec).length ? defs : []);
      }

      titleEl.textContent = (state.customLabel && state.customLabel.trim() !== '') ? state.customLabel : '';
      titleEl.classList.toggle('hidden', state.showLabel === false || !titleEl.textContent);

      var data = sumData.data || [];
      var mcols = defs.map(function (d) {
        var num = isNumCol(d.idx);
        var type = cols[d.idx].dataType;
        var vals = data.map(function (row) { var c = row[d.idx]; return c && typeof c.value === 'number' ? c.value : 0; });
        return {
          title: d.title, num: num, align: d.align, format: d.format, visual: d.visual,
          isDate: type === 'date' || type === 'date-time',
          stats: [{ min: vals.length ? Math.min.apply(null, vals) : 0, max: vals.length ? Math.max.apply(null, vals) : 0 }]
        };
      });
      var rows = data.map(function (row) {
        return defs.map(function (d, j) {
          var c = row[d.idx];
          var v = c && typeof c.value === 'number' && !isNaN(c.value) ? c.value : 0;
          var k = mcols[j].isDate && c ? Date.parse(c.value) : NaN;
          return { v: v, k: k, text: fmtValue(mcols[j], c) };
        });
      });
      // amostra formatada de cada coluna (para formatar as somas das linhas-pai)
      mcols.forEach(function (mc, j) {
        for (var q = 0; q < rows.length; q++) { if (rows[q][j].text !== '') { mc.sample = rows[q][j].text; break; } }
      });
      // selos: ordem dos valores distintos (cor da paleta) e se a coluna é uma curva ABC (só A, B e C)
      mcols.forEach(function (mc, j) {
        if (mc.visual !== 'badge') return;
        mc.badgeOrder = {};
        var n = 0, abc = true;
        rows.forEach(function (r) {
          var k = String(r[j].text).trim();
          if (k === '') return;
          if (!(k in mc.badgeOrder)) mc.badgeOrder[k] = n++;
          if (!/^[ABC]$/i.test(k)) abc = false;
        });
        mc.badgeAbc = abc;
      });
      // a linha identifica a marca pelas dimensões (colunas não numéricas) da planilha
      var dimIdxs = [];
      cols.forEach(function (cc, i) { if (!isNumCol(i)) dimIdxs.push(i); });
      rows.forEach(function (r, i) { r.sel = pdSel(cols, data[i], dimIdxs); });
      var defaultSort = null;
      if (state.sortField) {
        var si = defs.findIndex(function (d) { return cols[d.idx].fieldName === state.sortField; });
        if (tree) si = si !== -1 ? si + 1 : (levelIdxs.some(function (li) { return cols[li].fieldName === state.sortField; }) ? 0 : -1);
        if (si !== -1) defaultSort = { idx: si, dir: state.sortOrder === 'asc' ? 'asc' : 'desc' };
      }
      model = { cols: mcols, rows: rows, defaultSort: defaultSort, tree: tree };
      if (tree) {
        var tr0 = buildTree(levelIdxs, mcols, rows, data, cols);
        model.treeTop = tr0.top; model.treeAll = tr0.all;
        model.cols = [{
          title: (state.hierarchyTitle && state.hierarchyTitle.trim()) || levelIdxs.map(function (li) { return cols[li].fieldName; }).join(' \u203A '),
          num: false, align: '', format: 'auto', visual: '', stats: [{ min: 0, max: 0 }]
        }].concat(mcols);
        // escala de barras e mapa de calor por nível (o total de um pai não deve achatar as barras dos filhos)
        mcols.forEach(function (mc, j) {
          mc.stats = [];
          model.treeAll.forEach(function (n) {
            if (n[j + 1].blank) return;
            var st0 = mc.stats[n.depth] || (mc.stats[n.depth] = { min: Infinity, max: -Infinity });
            st0.min = Math.min(st0.min, n[j + 1].v); st0.max = Math.max(st0.max, n[j + 1].v);
          });
          for (var d0 = 0; d0 < levelIdxs.length; d0++) if (!mc.stats[d0]) mc.stats[d0] = { min: 0, max: 0 };
        });
        if (!expandedInit) { applyExpandDefault(); expandedInit = true; }
      }
      render();
    }).catch(function (err) {
      clearTimeout(loadTimeoutId);
      console.error('[Projedata Tabela] erro ao ler dados da planilha:', err);
      titleEl.textContent = 'Erro: ' + (err && (err.message || err.toString()) || 'ver console (F12)');
      tbl.innerHTML = '';
    });
  }

  function openConfigDialog() {
    tableau.extensions.ui.displayDialogAsync('https://renatoheinzen.github.io/tableau-skin/html/data-table-config.html', '', { height: 860, width: 340 })
      .then(function () { loadState(); expandedInit = false; updateChart(); })
      .catch(function (error) {
        console.log('[Projedata Tabela] dialog fechado:', error && error.message);
      });
  }

  if (typeof tableau === 'undefined' || !tableau.extensions) {
    titleEl.textContent = 'Falha ao carregar script da API do Tableau';
    return;
  }

  var initTimeoutId = setTimeout(function () {
    titleEl.textContent = 'Timeout: initializeAsync não respondeu em 15s';
  }, 15000);

  try {
    tableau.extensions.initializeAsync({ configure: openConfigDialog }).then(function () {
      clearTimeout(initTimeoutId);
      loadState();
      tableau.extensions.worksheetContent.worksheet.addEventListener(tableau.TableauEventType.SummaryDataChanged, updateChart);
      pdInitClick();
      updateChart();
    }).catch(function (err) {
      clearTimeout(initTimeoutId);
      titleEl.textContent = 'Erro no initializeAsync: ' + (err && (err.message || err.toString()) || 'desconhecido');
    });
  } catch (syncErr) {
    clearTimeout(initTimeoutId);
    titleEl.textContent = 'Erro síncrono: ' + (syncErr && syncErr.message || syncErr);
  }
})();
</script>

</body>
